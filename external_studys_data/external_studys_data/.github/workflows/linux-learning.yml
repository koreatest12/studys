name: Ultra Mega Server V15 (Auto-Repair)

on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 대량 데이터 갱신
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "mega-server-v15"
  cancel-in-progress: false

jobs:
  ultra-repair-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 최대 실행 시간 보장

    steps:
      # 1. 🏁 시스템 초기화 및 체크아웃
      - name: 📥 Initialize System
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 🛡️ [Fix] 충돌 방지: 기존 외부 데이터 강제 삭제 (에러 해결 핵심)
      - name: 🗑️ Force Clean Conflict Directories
        run: |
          echo "=== 🚨 DETECTING CONFLICTS ==="
          if [ -d "external_studys_data" ]; then
            echo "⚠️ Found existing directory. Removing for fresh install..."
            rm -rf external_studys_data
          fi
          
          # 불필요한 임시 파일 대량 삭제
          rm -rf *.log *.tmp
          echo "✅ Workspace Cleaned. Ready for Clone."

      # 3. 🧹 [System] 초극강 디스크 확보 (Smart Clean V2)
      - name: 🧹 Execute Extreme Disk Cleanup
        run: |
          echo "=== 🧹 STARTING EXTREME CLEANUP V2 ==="
          
          # 1. 대용량 툴체인 삭제 (약 30GB 확보 목표)
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # 2. Docker & Swap 정리
          docker system prune -af
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          
          df -h /
          echo "✅ Disk Capacity Maximized."

      # 4. 🔗 [External] 외부 리포지토리 대량 통합 (Clean Clone)
      - name: 📡 Mass Integrate External Repo
        run: |
          echo "=== 📥 Cloning External Data ==="
          # 폴더가 깨끗해졌으므로 에러 없이 클론 가능
          git clone --depth 1 https://github.com/koreatest12/studys.git external_studys_data
          
          # .git 제거 및 권한 부여
          rm -rf external_studys_data/.git
          chmod -R 777 external_studys_data
          
          echo "✅ External Data Integration Complete."

      # 5. ⚙️ [Config] Jekyll 빌드 에러 방지 (필수)
      - name: ⚙️ Configure Jekyll Exclusion
        run: |
          # 외부 코드의 Liquid 문법 충돌 방지
          cat <<EOF > _config.yml
          title: Ultra Mega Server V15
          theme: jekyll-theme-slate
          exclude:
            - external_studys_data/
            - node_modules/
            - vendor/
            - .github/
            - "*.json"
          EOF

      # 6. 🏭 [Engine] 대량 데이터 생성 및 테이블 샤딩 (Safe Mode)
      - name: 🏗️ Run Massive Data Generator V15
        run: |
          cat <<'EOF' > mega_generator_v15.py
          import os
          import random
          import datetime
          import shutil
          import sqlite3
          import time

          # === [1] 디스크 안전 감지 함수 (Crash 방지) ===
          def is_disk_safe(min_gb=1.5):
              total, used, free = shutil.disk_usage("/")
              return (free / (1024**3)) > min_gb

          # === [2] 서비스 메쉬 디렉토리 구조 생성 ===
          base_dir = "Mega_Service_Mesh"
          services = [
              "Auth_Server", "Payment_Cluster", "User_Node_A", 
              "User_Node_B", "Log_Vault", "Backup_Shard"
          ]
          
          # 기존 데이터 정리 후 재생성 (중복 방지)
          if os.path.exists(base_dir):
              shutil.rmtree(base_dir)
          os.makedirs(base_dir, exist_ok=True)

          # === [3] DB 테이블 대량 생성 ===
          db_path = f"{base_dir}/enterprise_core.db"
          conn = sqlite3.connect(db_path)
          cursor = conn.cursor()
          
          tables = ["access_logs", "transaction_history", "error_reports", "user_sessions"]
          for tbl in tables:
              cursor.execute(f"CREATE TABLE IF NOT EXISTS {tbl} (id INTEGER PRIMARY KEY, data TEXT, created_at TIMESTAMP)")

          print(">> 🚀 Generating Massive Data Shards...")

          # === [4] 파일 및 레코드 대량 투입 ===
          file_count = 0
          
          for svc in services:
              svc_path = f"{base_dir}/{svc}"
              os.makedirs(svc_path, exist_ok=True)
              
              # 4-1. DB 레코드 대량 삽입
              for _ in range(100):
                  cursor.execute(f"INSERT INTO access_logs (data, created_at) VALUES (?, ?)", 
                                (f"Access from {svc} node", datetime.datetime.now()))
              
              # 4-2. 파일 생성 (용량 체크하며 진행)
              if is_disk_safe():
                  # 5개 ~ 10개의 중형 파일 생성
                  for i in range(random.randint(5, 10)):
                      # 파일 크기 5MB ~ 15MB (안전 범위 내 최대화)
                      size_mb = random.randint(5, 15)
                      fname = f"{svc_path}/shard_{i}_{int(time.time())}.bin"
                      try:
                          with open(fname, "wb") as f:
                              f.seek((size_mb * 1024 * 1024) - 1)
                              f.write(b'\0')
                          file_count += 1
                      except:
                          break
              else:
                  print(f"⚠️ Skipping large files for {svc} (Disk Limit Reached)")
                  with open(f"{svc_path}/overflow_alert.txt", "w") as f:
                      f.write("Disk Full - Generation Paused")

          conn.commit()
          conn.close()
          print(f"✅ Generated {file_count} shards across {len(services)} services.")

          # === [5] 어드민 대시보드 생성 ===
          total, used, free = shutil.disk_usage("/")
          used_gb = used // (1024**3)
          total_gb = total // (1024**3)
          
          html = f"""
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>MEGA SERVER V15 STATUS</title>
              <style>
                  body {{ background: #111; color: #0f0; font-family: 'Courier New'; padding: 20px; }}
                  .box {{ border: 1px solid #0f0; padding: 15px; margin-bottom: 20px; }}
                  h1 {{ text-align: center; border-bottom: 1px solid #0f0; }}
                  .bar {{ background: #333; height: 20px; width: 100%; }}
                  .fill {{ background: #0f0; height: 100%; width: {(used/total)*100}%; }}
              </style>
          </head>
          <body>
              <h1>🖥️ ULTRA SERVER V15 ONLINE</h1>
              <div class="box">
                  <h3>💾 DISK STATUS (AUTO-MANAGED)</h3>
                  <div class="bar"><div class="fill"></div></div>
                  <p>{used_gb} GB Used / {total_gb} GB Total</p>
                  <p>Generated Files: {file_count} Shards</p>
              </div>
              <div class="box">
                  <h3>🔗 EXTERNAL INTEGRATION</h3>
                  <p>Repository: koreatest12/studys (Integrated)</p>
                  <p>Status: Active</p>
              </div>
              <div class="box">
                  <h3>🛡️ AUTO-REPAIR LOG</h3>
                  <p>Conflict Resolution: Executed</p>
                  <p>Directory Clean: Completed</p>
              </div>
          </body>
          </html>
          """
          
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          
          python3 mega_generator_v15.py

      # 7. 🚀 [Deploy] 최종 반영 (충돌 방지 로직 포함)
      - name: 🚀 Sync & Deploy
        run: |
          git config --global user.name "Mega-Bot-V15"
          git config --global user.email "bot@v15.internal"
          
          # LFS 추적
          git lfs install
          git lfs track "*.bin" "*.db"
          
          git add .
          
          # 커밋 시도 (변경 없으면 통과)
          git commit -m "🚀 V15 Update: Auto-Repair & Mass Generation [$(date)]" || echo "No changes to commit"
          
          # 원격지와 충돌 시 강제 병합 전략
          git pull --rebase origin main || (git rebase --abort && git pull origin main --strategy-option=theirs)
          git push origin main || echo "Push skipped (Transient Network Issue)"

      # 8. Pages 배포
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ultra-repair-ops
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
