name: 🛡️ Infinity Scale Ops (Syntax Fixed)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        default: 'Process-All-Files'
        type: choice
        options:
          - Process-All-Files
          - Full-Scan
          - Fix-Only
      retry_count:
        description: '현재 재시도 횟수 (시스템 자동 관리)'
        default: '0'
        required: false

jobs:
  infinity-ops:
    name: 🔄 Chain Executor (Run ${{ inputs.retry_count }}/999)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write

    steps:
      # 1. [시스템 정리] 디스크 공간 확보
      - name: 🧹 Extreme Disk Cleanup
        run: |
          echo "⚠️ [Step 1] Initial Disk Space:"
          df -h
          echo "🧹 Performing aggressive cleanup..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -a -f
          echo "✅ [Cleanup Complete]"

      # 2. [저장소 체크아웃]
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. [Python 설정]
      - name: 🔥 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. [스크립트 생성 및 실행] 문법 오류 원천 차단 방식
      - name: 🧠 Generate & Run Robust Script
        id: processor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Python 스크립트를 파일로 먼저 작성 (따옴표 충돌 방지)
          cat << 'EOF' > ops_script.py
          import os
          import shutil
          import sys
          import gc
          import time

          # === [설정] ===
          MIN_FREE_SPACE_MB = 1000
          LOG_FILE = 'processed_files.log'
          REPO_ROOT = '.'
          
          # 환경변수 안전하게 가져오기
          repo_name = os.environ.get('REPO_NAME', 'Unknown-Repo')
          retry_cnt = os.environ.get('RETRY_COUNT', '0')
          
          print(f"🚀 Starting Precision Ops on: {repo_name} (Retry: {retry_cnt})")

          # 1. 이전 작업 내역 로드
          processed = set()
          if os.path.exists(LOG_FILE):
              with open(LOG_FILE, 'r', encoding='utf-8') as f:
                  processed = set(line.strip() for line in f if line.strip())
          print(f"📚 Previously Processed Files: {len(processed)}")

          # 2. 처리할 파일 스캔 (Recursive)
          files_to_process = []
          for root, dirs, files in os.walk(REPO_ROOT):
              if '.git' in root: continue # .git 폴더 제외
              
              for file in files:
                  full_path = os.path.join(root, file)
                  # 로그 파일 자체와 스크립트 파일은 제외
                  if full_path not in processed and not full_path.endswith(LOG_FILE) and not full_path.endswith('ops_script.py'):
                      files_to_process.append(full_path)

          total_files = len(files_to_process)
          print(f"🔍 Files remaining to process: {total_files}")

          if total_files == 0:
              print("✅ All files are already processed!")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  print('needs_retry=false', file=fh)
              sys.exit(0)

          # 3. 작업 수행 루프
          stop_signal = False
          
          for idx, file_path in enumerate(files_to_process):
              # [디스크 감지]
              total, used, free = shutil.disk_usage('/')
              free_mb = free // (1024 * 1024)
              
              if free_mb < MIN_FREE_SPACE_MB:
                  print(f"⚠️ [LOW DISK] {free_mb}MB left. Stopping explicitly.")
                  stop_signal = True
                  break
              
              # [실제 작업 영역]
              try:
                  # 파일 존재 여부 재확인 (Race condition 방지)
                  if os.path.exists(file_path):
                      # 여기에 실제 파일 처리 로직 (암호화, 분석 등)
                      # file_size = os.path.getsize(file_path)
                      pass 
              except Exception as e:
                  print(f"❌ Error processing {file_path}: {e}")
              
              # [상태 기록]
              processed.add(file_path)
              with open(LOG_FILE, 'a', encoding='utf-8') as log:
                  log.write(f"{file_path}\n")

              # [메모리 최적화] 대량 파일 처리 시 필수
              if idx % 500 == 0:
                  gc.collect()
                  # print(f"   -> Progress: {idx}/{total_files}")

          # 4. 결과 출력
          if stop_signal:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  print('needs_retry=true', file=fh)
              print("🛑 Logic paused for recovery.")
          else:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  print('needs_retry=false', file=fh)
              print("🎉 Batch complete.")
          EOF
          
          # 생성된 스크립트 실행
          python3 ops_script.py

      # 5. [상태 저장]
      - name: 💾 Save Checkpoint
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add processed_files.log
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "💾 Progress Update: Run ${{ inputs.retry_count }} [skip ci]"
            # 충돌 발생 시 원격 저장소 내용을 우선으로 병합하지 않고, 우리 변경사항을 유지하며 재시도
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF}
            echo "✅ Progress saved."
          else
             echo "ℹ️ No changes needed."
          fi

      # 6. [999회 자동 재수행]
      - name: 🔄 Trigger Next Chain
        if: steps.processor.outputs.needs_retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RETRY: ${{ inputs.retry_count }}
        run: |
          MAX_RETRIES=999
          NEXT_RETRY=$(($CURRENT_RETRY + 1))
          
          if [ "$NEXT_RETRY" -le "$MAX_RETRIES" ]; then
            echo "🚀 Triggering Run #$NEXT_RETRY / $MAX_RETRIES..."
            sleep 5
            gh workflow run "${{ github.workflow }}" -f mode="${{ inputs.mode }}" -f retry_count="$NEXT_RETRY"
          else
            echo "❌ Max retries reached."
            exit 1
          fi
