name: Mass Build & Dockerfile Generation & Deploy

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/10 * * * *'  # 10분 단위 대량 반복 수행
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  mass-deployment:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃 (전체 히스토리)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 서버 환경 대량 업데이트 및 필수 도구 설치
      - name: Mass Server Update & Install Tools
        run: |
          sudo apt-get update && sudo apt-get upgrade -y
          sudo apt-get install -y curl wget git unzip tree docker.io

      # 3. Java 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 4. Dockerfile 대량/자동 생성 (요청하신 내용 반영)
      - name: Generate Dockerfile Massively
        run: |
          echo "Generating Dockerfile..."
          # 기존 파일이 있어도 덮어씌움 (항상 최신 상태 유지)
          cat <<EOF > Dockerfile
          # Base Image (Java 17)
          FROM eclipse-temurin:17-jdk-alpine
          
          # 작업 디렉토리 설정
          WORKDIR /app
          
          # 빌드된 Jar 파일 복사
          COPY target/*.jar app.jar
          
          # 디렉토리 및 권한 설정 (이미지 내부)
          RUN mkdir -p /app/logs /app/data && chmod -R 777 /app
          
          # 실행 명령어
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
          
          # 생성 확인
          cat Dockerfile

      # 5. Maven 빌드 (pom.xml 자동 생성 포함)
      - name: Build with Maven
        run: |
          # pom.xml 없을 시 자동 생성
          if [ ! -f pom.xml ]; then
            echo '<project><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId><artifactId>demo</artifactId><version>0.0.1-SNAPSHOT</version><properties><java.version>17</java.version></properties></project>' > pom.xml
          fi
          # 테스트 건너뛰고 패키징
          mvn -B package --file pom.xml -DskipTests

      # 6. Docker 이미지 대량 빌드 및 컨테이너 실행
      - name: Build Image & Run Container
        run: |
          # 이미지 빌드
          docker build -t my-mass-app:latest .
          
          # 기존 컨테이너 정리 후 재실행
          docker rm -f my-mass-container || true
          docker run -d --name my-mass-container -p 8080:8080 my-mass-app:latest
          
          # 실행 상태 확인
          docker ps -a

      # 7. Git 충돌 방지 및 대량 업데이트 사항 커밋/푸시
      - name: Mass Git Push & Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 로그 파일 생성
          mkdir -p logs
          echo "Run at $(date)" >> logs/deployment_log.txt
          
          # Dockerfile도 저장소에 반영하기 위해 추가
          git add Dockerfile logs/
          
          # 원격 변경사항 먼저 가져오기 (충돌 방지 핵심)
          git pull origin main --rebase
          
          # 변경사항이 있을 경우에만 푸시
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: Mass Dockerfile Update & Server Deploy [skip ci]"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
