name: Mass Encoding Fix & XML/Cache Gen & Deploy

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/10 * * * *'   # 10분 단위 대량 반복
  workflow_dispatch:

# [인코딩 핵심 1] 워크플로우 전체에 UTF-8 강제 적용
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.language=en -Duser.country=US"

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  mass-encoding-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. [용량] 디스크 정리 (30GB+ 확보)
      - name: Massive Disk Cleanup
        run: |
          echo "Cleaning up disk space..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          
          if command -v docker &> /dev/null; then
            sudo docker image prune --all --force
          fi
          df -h

      # 2. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. [인코딩 핵심 2] Git 한글 깨짐 방지 설정
      - name: Fix Git Encoding & Quoting
        run: |
          git config --global core.quotepath false
          git config --global i18n.commitencoding utf-8
          git config --global i18n.logoutputencoding utf-8
          echo "Git encoding fixed for Korean characters."

      # 4. [서비스] 필수 유틸리티 설치 (Docker 충돌 방지됨)
      - name: Mass Install JDK & Services
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk maven curl wget git unzip tree acl build-essential locales
          
          # 로케일 생성 (UTF-8)
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      # 5. [JDK] 액션 환경 설정 및 캐시
      - name: Set up JDK 17 with Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 6. [설정 파일] Maven/Docker 파일 대량 생성 (인코딩 옵션 주입)
      - name: Mass Generate Configs (Encoding Inject)
        run: |
          mkdir -p ~/.m2
          
          # 1. settings.xml
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <interactiveMode>false</interactiveMode>
          </settings>
          EOF
          
          # 2. pom.xml 생성 (인코딩 속성 대량 추가)
          if [ ! -f pom.xml ]; then
            echo "Generating pom.xml with encoding properties..."
            cat <<EOF > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>demo</artifactId>
            <version>0.0.1-SNAPSHOT</version>
            <properties>
              <java.version>17</java.version>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              <project.reporting.outputEncoding>UTF-8</project.reporting.outputEncoding>
              <maven.compiler.encoding>UTF-8</maven.compiler.encoding>
            </properties>
          </project>
          EOF
          fi
          
          # 3. Dockerfile 생성 (컨테이너 내부 인코딩 설정 추가)
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-alpine
          
          # 컨테이너 로케일 설정
          ENV LANG=C.UTF-8 \
              LC_ALL=C.UTF-8
              
          WORKDIR /app
          COPY target/*.jar app.jar
          RUN mkdir -p /app/logs /app/data && chmod -R 777 /app
          
          # JVM 실행 시 UTF-8 강제
          ENTRYPOINT ["java", "-Dfile.encoding=UTF-8", "-Dsun.jnu.encoding=UTF-8", "-jar", "app.jar"]
          EOF
          
          sudo chmod -R 777 .

      # 7. [캐시] 의존성 미리 받기 (Offline 모드)
      - name: Mass Create Cache Files
        run: mvn dependency:go-offline -B --file pom.xml

      # 8. Maven 빌드 (인코딩 인수 명시)
      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests -Dfile.encoding=UTF-8

      # 9. Docker 이미지 빌드 및 실행
      - name: Build & Run Container
        run: |
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh
          fi
          
          if [ -e /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock
          fi
  
          docker rm -f my-mass-container || true
          docker build -t my-mass-app:latest .
          docker run -d --name my-mass-container -p 8080:8080 my-mass-app:latest
          docker ps -a

      # 10. [Git] 대량 푸시 (UTF-8 로그 포함)
      - name: Mass Git Push & Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p logs
          echo "Deploy Success (Encoding Fixed) at $(date)" >> logs/deploy_log.txt
          
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Mass Encoding Fix & Deploy [skip ci]"
            echo "Changes committed."
          else
            echo "No changes."
          fi
          
          git pull origin main --rebase
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
