name: Mass n8n Smart Build & Dependency Fix & Deploy

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/10 * * * *'   # 10분 단위 반복
  workflow_dispatch:

# [전역] 인코딩 및 메모리 대량 증설 (빌드 멈춤 방지)
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  # Node.js 힙 메모리 12GB로 대량 증설 (n8n 빌드는 메모리를 많이 먹습니다)
  NODE_OPTIONS: "--max_old_space_size=12288"

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  mass-smart-build:
    runs-on: ubuntu-latest

    steps:
      # 1. [용량] 디스크 최대 확보 (빌드 캐시용)
      - name: Massive Disk Cleanup
        run: |
          echo "Maximizing disk space..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          if command -v docker &> /dev/null; then
            sudo docker image prune --all --force
          fi
          df -h

      # 2. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. [환경 설정] Node.js v22 (필수 요구사항) & Java 17
      - name: Setup Node.js 22 & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 중요: n8n 최신 버전은 v22+ 필수
      
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 4. [pnpm 설정] pnpm 설치 (Corepack 활용)
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      # 5. [n8n 통합] 대량 클론
      - name: Mass Clone n8n Repository
        run: |
          mkdir -p n8n_integration
          rm -rf n8n_integration/n8n_source
          echo "Cloning n8n source..."
          git clone --depth 1 https://github.com/n8n-io/n8n.git n8n_integration/n8n_source
          
          # .git 폴더 제거 (서브모듈 문제 방지)
          rm -rf n8n_integration/n8n_source/.git
          echo "Clone complete."

      # 6. [보안] Push 차단 파일 자동 제거
      - name: Remove Security Violations
        run: |
          echo "Removing blocked secret files..."
          rm -f n8n_integration/n8n_source/packages/cli/src/modules/external-secrets.ee/providers/vault.ts
          find n8n_integration -name "*secret*" -type f -delete || true
          find n8n_integration -name "*.key" -type f -delete || true
          find n8n_integration -name "*.pem" -type f -delete || true

      # 7. [핵심 수정] 스마트 의존성 설치 및 순차 빌드 (Turbo 활용)
      # 
      - name: Mass Smart Install & Build (Topological)
        working-directory: n8n_integration/n8n_source
        run: |
          echo ">>> 1. Installing Workspace Dependencies..."
          # --no-frozen-lockfile: 락파일 무시하고 강제 설치 (호환성 문제 해결)
          # --ignore-scripts: 빌드 전 불필요한 스크립트 실행 방지 (속도 향상)
          pnpm install --no-frozen-lockfile --ignore-scripts
          
          echo ">>> 2. Running Topological Build (Smart Order)..."
          # turbo를 사용하여 의존성 순서대로 빌드 (errors -> utils -> workflow -> core -> cli)
          # 개별 패키지 폴더로 가지 않고 루트에서 한 번에 실행해야 순서가 맞습니다.
          # 빌드 오류가 있어도 배포는 진행되도록 `|| true` 처리
          pnpm turbo build --filter=n8n --filter=n8n-nodes-base --filter=n8n-workflow || echo "Build Warning: Continuing deployment..."

      # 8. [설정] Java/Maven 설정 파일 생성
      - name: Mass Generate Configs
        run: |
          mkdir -p src/main/java/com/example/demo src/main/resources ~/.m2
          
          # pom.xml
          cat <<EOF > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>demo</artifactId>
            <version>0.0.1-SNAPSHOT</version>
            <packaging>jar</packaging>
            <properties>
              <java.version>17</java.version>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.11.0</version>
                  <configuration><source>17</source><target>17</target><encoding>UTF-8</encoding></configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF
          
          # Dockerfile (Node 22 업데이트)
          cat <<EOF > Dockerfile
          FROM node:22-alpine
          RUN apk add --no-cache openjdk17-jre git
          WORKDIR /app
          COPY n8n_integration/n8n_source /app/n8n
          COPY target/*.jar app.jar
          RUN mkdir -p /app/logs /app/data && chmod -R 777 /app
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF

      # 9. 권한 부여 및 Maven 빌드
      - name: Finalize & Build Java
        run: |
          sudo chmod -R 777 .
          mvn -B package --file pom.xml -DskipTests -Dfile.encoding=UTF-8

      # 10. [Git Fix] 대량 푸시 및 강제 동기화
      - name: Mass Git Push & Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p logs
          echo "Mass Smart Build & Deploy at $(date)" >> logs/deploy_log.txt
          
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Mass n8n Smart Build Fix [skip ci]"
          else
            echo "No changes."
          fi
          
          echo "Syncing remote..."
          git fetch origin main
          if git pull origin main --rebase --autostash; then
             git push origin main
          else
             echo "Rebase failed. Forcing merge..."
             git rebase --abort || true
             git pull origin main --no-rebase -s recursive -X ours
             git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
