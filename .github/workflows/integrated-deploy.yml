name: Mass Fix Conflict & Deploy

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/10 * * * *'   # 10분 단위 대량 반복
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  mass-fix-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. [용량] 충돌 방지를 위한 디스크 정리 (외부 액션 미사용)
      - name: Massive Disk Cleanup
        run: |
          echo "Cleaning up disk space..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          
          # Docker 이미지 정리 (설치 충돌과 무관하게 용량 확보용)
          if command -v docker &> /dev/null; then
            sudo docker image prune --all --force
          fi
          df -h

      # 2. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. [수정됨] JDK 및 필수 유틸리티 대량 설치 (Docker 제외)
      # docker.io를 여기서 설치하면 충돌(Exit code 100)이 발생하므로 제거했습니다.
      - name: Mass Install JDK & Services
        run: |
          echo "Installing System Services & JDK..."
          sudo apt-get update
          
          # 충돌 원인인 docker.io 제거하고, JDK와 나머지 유틸리티만 설치
          sudo apt-get install -y openjdk-17-jdk maven curl wget git unzip tree acl build-essential
          
          # 설치 확인
          java -version
          mvn -version

      # 4. [Docker 설정] 이미 설치된 Docker 활용 및 권한 부여
      - name: Setup Docker Environment
        run: |
          # Docker가 없으면 공식 스크립트로 설치 (apt 충돌 회피)
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing via script..."
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh
          else
            echo "Docker is already installed. Skipping install to avoid conflicts."
          fi
          
          # 소켓 권한 부여 (Permission denied 방지)
          if [ -e /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock
          fi
          docker --version

      # 5. [Actions JDK] 환경 변수 설정
      - name: Set up JDK 17 (Action Level)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 6. [자가 치유] 설정 파일 및 디렉토리 강제 생성
      - name: Auto-Fix & Generate Configs
        run: |
          echo "Running Self-Healing Script..."
          sudo chmod -R 777 .
          
          # Dockerfile 강제 생성
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-alpine
          WORKDIR /app
          COPY target/*.jar app.jar
          RUN mkdir -p /app/logs /app/data && chmod -R 777 /app
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
          
          # pom.xml 강제 생성
          if [ ! -f pom.xml ]; then
            echo '<project><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId><artifactId>demo</artifactId><version>0.0.1-SNAPSHOT</version><properties><java.version>17</java.version></properties></project>' > pom.xml
          fi
          
          mkdir -p logs reports

      # 7. Maven 빌드
      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      # 8. Docker 이미지 대량 빌드 및 실행
      - name: Build & Run Container
        run: |
          docker rm -f my-mass-container || true
          docker build -t my-mass-app:latest .
          docker run -d --name my-mass-container -p 8080:8080 my-mass-app:latest
          docker ps -a

      # 9. [Git 충돌 해결] 커밋 -> 풀 -> 푸시
      - name: Mass Git Push & Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Fixed Conflict at $(date)" >> logs/deploy_log.txt
          
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "Fix: Resolve Docker Conflict & Mass Update [skip ci]"
            echo "Changes committed."
          else
            echo "No changes."
          fi
          
          git pull origin main --rebase
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
