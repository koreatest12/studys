name: Mass Scale Fix & Capacity Boost & Deploy

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/10 * * * *'   # 10분 단위 대량 반복
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  mass-deploy-fix:
    runs-on: ubuntu-latest

    steps:
      # 1. [용량 증설] 불필요한 소프트웨어 대량 삭제로 최대 70GB 공간 확보
      - name: Maximize Build Space (Mass Capacity Boost)
        uses: aditi-singh/remove-unwanted-software@v1
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. [권한] 대량 권한 부여 (777)
      - name: Mass Permission Grant
        run: |
          echo "Setting 777 permissions recursively..."
          sudo chmod -R 777 .
          sudo chown -R $USER:$USER .

      # 4. 서버 환경 설정 및 Docker 체크
      - name: Setup Server & Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget git unzip tree acl
          
          # Docker 소켓 권한 부여
          if [ -e /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock
          fi

      # 5. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 6. 설정 파일(Dockerfile, pom.xml) 대량 생성
      - name: Generate Config Files Massively
        run: |
          # Dockerfile 생성 (영어 문법 준수)
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-alpine
          WORKDIR /app
          COPY target/*.jar app.jar
          RUN mkdir -p /app/logs /app/data && chmod -R 777 /app
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
          
          # pom.xml 생성 (없을 경우)
          if [ ! -f pom.xml ]; then
            echo '<project><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId><artifactId>demo</artifactId><version>0.0.1-SNAPSHOT</version><properties><java.version>17</java.version></properties></project>' > pom.xml
          fi

      # 7. Maven 빌드
      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      # 8. Docker 이미지 대량 빌드 및 컨테이너 실행
      - name: Build & Run Container
        run: |
          docker build -t my-mass-app:latest .
          docker rm -f my-mass-container || true
          docker run -d --name my-mass-container -p 8080:8080 my-mass-app:latest
          docker ps -a

      # 9. [핵심 수정] Git 충돌 방지 및 대량 업데이트 (커밋 -> 풀 -> 푸시)
      - name: Mass Git Push & Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 로그 생성
          mkdir -p logs
          echo "Deploy Success at $(date)" >> logs/deploy_log.txt
          
          # 1. 모든 변경 사항 스테이징
          git add .
          
          # 2. 로컬 커밋 먼저 수행 (이전의 에러 방지 핵심)
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Mass Capacity & Update Success [skip ci]"
            echo "Local changes committed."
          else
            echo "No changes to commit."
          fi
          
          # 3. 원격 변경사항 가져오기 (Rebase)
          git pull origin main --rebase
          
          # 4. 최종 푸시
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
