name: Fixed Mass Build & Docker Deploy

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/10 * * * *'  # 10분 단위 반복
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  mass-fix-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃 (Git 충돌 방지용 전체 호출)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. [수정됨] 패키지 충돌 방지 및 유틸리티 설치
      # docker.io를 apt-get에서 제거하여 충돌 에러(Exit code 100) 해결
      - name: Mass Server Update & Install Utilities
        run: |
          sudo apt-get update
          # 충돌을 피하기 위해 docker.io 제거, 필수 유틸리티만 설치
          sudo apt-get install -y curl wget git unzip tree acl

      # 3. [추가] Docker 상태 확인 및 권한 대량 부여
      # 이미 설치된 Docker를 활용하거나, 없을 경우 안전한 스크립트로 설치
      - name: Setup Docker Environment
        run: |
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing via official script..."
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh
          else
            echo "Docker is already installed. Skipping installation to avoid conflicts."
          fi
          
          # 소켓 권한 부여 (Permission denied 방지)
          sudo chmod 666 /var/run/docker.sock
          docker version

      # 4. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 5. Dockerfile 강제 대량 생성 (요청 내용 반영)
      - name: Generate Dockerfile Massively
        run: |
          echo "Overwriting Dockerfile with mass settings..."
          cat <<EOF > Dockerfile
          # Base Image (Java 17)
          FROM eclipse-temurin:17-jdk-alpine
          
          # 작업 디렉토리 설정
          WORKDIR /app
          
          # 빌드된 Jar 파일 복사
          COPY target/*.jar app.jar
          
          # 디렉토리 및 권한 설정 (이미지 내부)
          RUN mkdir -p /app/logs /app/data && chmod -R 777 /app
          
          # 실행 명령어
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
          
          cat Dockerfile

      # 6. Maven 빌드 (pom.xml 자동 생성 포함)
      - name: Build with Maven
        run: |
          if [ ! -f pom.xml ]; then
            echo '<project><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId><artifactId>demo</artifactId><version>0.0.1-SNAPSHOT</version><properties><java.version>17</java.version></properties></project>' > pom.xml
          fi
          mvn -B package --file pom.xml -DskipTests

      # 7. Docker 이미지 빌드 및 컨테이너 실행
      - name: Build Image & Run Container
        run: |
          docker build -t my-mass-app:latest .
          
          # 기존 컨테이너 삭제 후 재생성
          docker rm -f my-mass-container || true
          docker run -d --name my-mass-container -p 8080:8080 my-mass-app:latest
          
          docker ps -a

      # 8. Git 충돌 해결 및 대량 업데이트 커밋
      - name: Mass Git Push & Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 로그 디렉토리 및 파일 생성
          mkdir -p logs
          echo "Fixed Deploy at $(date)" >> logs/fix_log.txt
          
          # 생성된 Dockerfile 및 로그 추가
          git add Dockerfile logs/
          
          # 원격 변경사항 가져오기 (Rebase로 충돌 방지)
          git pull origin main --rebase
          
          # 변경사항 푸시
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix: Resolve Docker Conflict & Mass Update [skip ci]"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
