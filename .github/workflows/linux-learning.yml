name: Linux System Release & Package Launch

on:
  # ⏰ 10분마다 실행 (데이터 누적 + 릴리즈 배포)
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  # 🟢 [필수] 릴리즈 생성을 위한 권한
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release-deploy-job:
    runs-on: ubuntu-latest
    steps:
      # 1. 저장소 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 동기화 및 준비
      - name: Sync & Prepare
        run: |
          git config --global user.name "Release-Bot"
          git config --global user.email "bot@noreply.github.com"
          git pull --rebase origin main || echo "Already up to date"
          
          mkdir -pv output_data/logs/concurrent_history
          mkdir -pv output_data/database/snapshots
          mkdir -pv output_data/source_code
          echo "✅ Environment Ready."

      # 3. 필수 도구 설치
      - name: Install Tools
        run: |
          sudo apt-get update || true
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-xetex fonts-nanum fonts-noto-cjk sqlite3 zip

      # 4. 동시성 실행 스크립트 (Zombie Process)
      - name: Create Concurrent Runner
        run: |
          # C 소스 안전 생성
          cat <<'CSOURCE' > output_data/source_code/zombie_maker.c
          #include <stdlib.h>
          #include <unistd.h>
          #include <stdio.h>
          int main() {
              if (fork() > 0) sleep(10);
              else exit(0);
              return 0;
          }
          CSOURCE

          # 실행 스크립트
          cat <<'EOF' > concurrent_runner.sh
          #!/bin/bash
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "=== 🚀 Concurrent Tasks [$TIMESTAMP] ==="
          
          gcc output_data/source_code/zombie_maker.c -o zombie_exec
          
          # 5개 프로세스 동시 실행
          for i in {1..5}; do
            ./zombie_exec &
          done
          
          # 시스템 스냅샷 로그 누적
          LOG_FILE="output_data/logs/concurrent_history/sys_snapshot_${TIMESTAMP}.log"
          {
            echo "snapshot_time: $TIMESTAMP"
            uptime
            free -h
            ps aux | grep 'Z\|defunct'
          } > "$LOG_FILE"
          
          wait
          rm -f zombie_exec
          echo "✅ Tasks Done."
          EOF
          chmod +x concurrent_runner.sh

      # 5. 데이터 누적 및 대시보드 생성 (Python)
      - name: Create Data Processor
        run: |
          cat <<'EOF' > data_processor.py
          import sqlite3, os, datetime, random

          timestamp = datetime.datetime.now().strftime("%Y%m%d_%H%M%S")
          db_path = "output_data/database/accumulated.db"

          # [1] DB 누적
          def accumulate_db():
              conn = sqlite3.connect(db_path)
              cur = conn.cursor()
              cur.execute("CREATE TABLE IF NOT EXISTS history (id INTEGER PRIMARY KEY, ts TEXT, msg TEXT);")
              for i in range(100):
                  cur.execute("INSERT INTO history (ts, msg) VALUES (?, ?)", (timestamp, f"Data Entry {i}"))
              conn.commit()
              
              # SQL 덤프 저장
              with open(f"output_data/database/snapshots/dump_{timestamp}.sql", "w") as f:
                  for line in conn.iterdump(): f.write(f"{line}\n")
              conn.close()

          # [2] 웹 대시보드 (index.html)
          def update_web():
              file_list = []
              for root, dirs, files in os.walk("output_data"):
                  for file in files:
                      path = os.path.join(root, file).replace(os.sep, '/')
                      stat = os.stat(os.path.join(root, file))
                      file_list.append({'name': file, 'path': path, 'time': stat.st_mtime})
              
              file_list.sort(key=lambda x: x['time'], reverse=True)
              
              html = f"""
              <!DOCTYPE html>
              <html>
              <head>
                  <meta charset='utf-8'>
                  <title>System Releases</title>
                  <style>
                      body {{ background: #111; color: #eee; font-family: sans-serif; padding: 20px; }}
                      .container {{ max-width: 1000px; margin: 0 auto; }}
                      table {{ width: 100%; border-collapse: collapse; margin-top: 20px; }}
                      th, td {{ padding: 10px; border-bottom: 1px solid #333; text-align: left; }}
                      th {{ background: #222; color: #4CAF50; }}
                      a {{ color: #2196F3; text-decoration: none; }}
                  </style>
              </head>
              <body>
                  <div class='container'>
                      <h1>📦 System Release & File Center</h1>
                      <p>Latest Check: {datetime.datetime.now()}</p>
                      <table><tr><th>File</th><th>Download</th></tr>
              """
              for f in file_list:
                  html += f"<tr><td>{f['name']}</td><td><a href='{f['path']}' download>Download</a></td></tr>"
              html += "</table></div></body></html>"
              
              with open("index.html", "w", encoding="utf-8") as f: f.write(html)

          if __name__ == "__main__":
              accumulate_db()
              update_web()
          EOF

      # 6. 실행
      - name: Execute System Logic
        run: |
          ./concurrent_runner.sh
          python3 data_processor.py

      # 7. 저장소 커밋 & 푸시
      - name: Commit & Push
        run: |
          git add .
          git commit -m "System Update: Data Accumulated [$(date)]" || echo "No changes"
          git pull --rebase origin main || echo "Rebase Handled"
          git push origin main || echo "Push Handled"

      # 🟢 [핵심 기능 1] 배포 패키지 생성 (ZIP 압축)
      - name: Create Distribution Package
        run: |
          echo "=== 📦 Packaging Artifacts ==="
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          PACKAGE_NAME="Linux_System_Package_${TIMESTAMP}.zip"
          
          # output_data 폴더 전체를 압축
          zip -r "$PACKAGE_NAME" output_data/ index.html
          
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "✅ Package Created: $PACKAGE_NAME"

      # 🟢 [핵심 기능 2] GitHub 릴리즈 자동 생성 및 패키지 업로드
      - name: Create Release & Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 🚀 Launching GitHub Release ==="
          
          # 버전 태그 생성 (시간 기반)
          TAG_NAME="v$(date +%Y.%m.%d-%H%M)"
          RELEASE_TITLE="System Release $TAG_NAME"
          
          # 릴리즈 노트 작성
          NOTES="## 🚀 Automated System Release
          - **Build Time**: $(date)
          - **Package**: ${{ env.PACKAGE_NAME }}
          - **Status**: Database updated, Logs accumulated.
          
          > This release was automatically generated by GitHub Actions."
          
          # gh CLI를 사용하여 릴리즈 생성 및 파일 첨부
          gh release create "$TAG_NAME" \
            "${{ env.PACKAGE_NAME }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target main
            
          echo "✅ Release Published: $TAG_NAME"

      # 8. 배포 (Pages)
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: release-deploy-job
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
