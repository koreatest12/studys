name: Linux Mega Server & Reboot System V9

on:
  # ⏰ 10분마다 실행 (재기동 및 데이터 생성)
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  mega-server-job:
    runs-on: ubuntu-latest
    steps:
      # 1. 저장소 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🟢 [기능 1] 극한의 용량 증설 (Max Capacity Hack)
      - name: 💾 Maximize Disk Capacity (~40GB+)
        run: |
          echo "=== 🧹 STARTING EXTREME CLEANUP ==="
          df -h /
          
          # 거대 패키지 강제 삭제 (Android, Dotnet, CodeQL, Haskell 등)
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/graalvm
          
          # Docker 이미지 정리
          docker system prune -af
          
          echo "=== ✨ CLEANUP COMPLETE ==="
          df -h /
          echo "✅ Disk Capacity Maximized for Heavy Load."

      # 2. 동기화 및 초기화
      - name: Sync & Init
        run: |
          git config --global user.name "Mega-Server-Bot"
          git config --global user.email "admin@megaserver.com"
          git pull --rebase origin main || echo "Sync OK"
          
          ROOT="File_Server_Root"
          mkdir -pv "$ROOT"/{System,Data,Logs,Boot}
          mkdir -pv output_data

      # 3. 필수 패키지 설치
      - name: Install Dependencies
        run: sudo apt-get install -y pandoc sqlite3 zip tree

      # 🟢 [기능 2] 서버 재기동 시뮬레이션 (Reboot Sequence)
      - name: 🔄 Simulate Full Server Restart
        run: |
          ROOT="File_Server_Root"
          BOOT_LOG="$ROOT/Boot/boot_sequence_$(date +%Y%m%d_%H%M%S).log"
          
          echo "=== 🛑 SERVER SHUTDOWN SEQUENCE ===" | tee -a "$BOOT_LOG"
          echo "[$(date)] Stopping Nginx Service... [OK]" | tee -a "$BOOT_LOG"
          echo "[$(date)] Stopping Database Engine... [OK]" | tee -a "$BOOT_LOG"
          echo "[$(date)] Unmounting Data Volumes... [OK]" | tee -a "$BOOT_LOG"
          echo "[$(date)] System Halted." | tee -a "$BOOT_LOG"
          
          echo "..."
          sleep 2 # 재부팅 대기 시간 시뮬레이션
          
          echo "=== ⚡ SERVER BOOT SEQUENCE ===" | tee -a "$BOOT_LOG"
          echo "[$(date)] Kernel Loaded (Linux 5.15.0-generic)" | tee -a "$BOOT_LOG"
          echo "[$(date)] Checking File Systems (fsck)... [CLEAN]" | tee -a "$BOOT_LOG"
          echo "[$(date)] Mounting Volumes... [OK]" | tee -a "$BOOT_LOG"
          echo "[$(date)] Starting Services... [OK]" | tee -a "$BOOT_LOG"
          echo "[$(date)] SYSTEM ONLINE." | tee -a "$BOOT_LOG"
          
          echo "✅ Reboot Simulation Complete."

      # 🟢 [기능 3] MB 단위 대용량 파일 생성 (Python Engine)
      - name: Run Massive Data Generator
        run: |
          cat <<'EOF' > mega_processor.py
          import os, random, datetime, shutil

          root_dir = "File_Server_Root"
          data_dir = f"{root_dir}/Data"
          
          # [1] 대용량 파일 생성 (Heavy Files)
          print(">> Generating MB-Scale Files...")
          # 10MB ~ 50MB 파일 5개 생성 (매번)
          for i in range(5):
              size_mb = random.randint(10, 50) 
              fname = f"backup_part_{i}_{datetime.datetime.now().strftime('%H%M%S')}.dat"
              fpath = f"{data_dir}/{fname}"
              
              # 더미 데이터 쓰기 (0으로 채움)
              with open(fpath, "wb") as f:
                  f.seek((size_mb * 1024 * 1024) - 1)
                  f.write(b'\0')
              
              print(f" + Generated {fname} ({size_mb} MB)")

          # [2] 디스크 사용량 분석
          total, used, free = shutil.disk_usage("/")
          used_percent = (used / total) * 100
          
          # [3] 웹 대시보드 생성 (게이지 바 포함)
          def generate_dashboard():
              files_html = ""
              # 최신 파일 20개만 표시
              all_files = []
              for r, d, f in os.walk(root_dir):
                  for file in f:
                      all_files.append(os.path.join(r, file))
              
              all_files.sort(key=os.path.getmtime, reverse=True)
              
              for fpath in all_files[:30]:
                  fname = os.path.basename(fpath)
                  size = os.path.getsize(fpath)
                  size_str = f"{size/1024/1024:.2f} MB" if size > 1024*1024 else f"{size/1024:.2f} KB"
                  path_display = fpath.replace("File_Server_Root", "")
                  
                  icon = "📄"
                  if fname.endswith(".log"): icon = "📜"
                  if fname.endswith(".dat"): icon = "💾"
                  
                  files_html += f"""
                  <tr>
                      <td>{icon} {fname}</td>
                      <td>{path_display}</td>
                      <td><b>{size_str}</b></td>
                      <td><a href='{fpath}' download>⬇️ Load</a></td>
                  </tr>
                  """

              html = f"""
              <!DOCTYPE html>
              <html lang='ko'>
              <head>
                  <meta charset='utf-8'>
                  <title>Mega Server V9</title>
                  <style>
                      body {{ background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; }}
                      .container {{ max-width: 1200px; margin: 0 auto; border: 2px solid #0f0; padding: 20px; box-shadow: 0 0 20px #0f0; }}
                      h1 {{ text-align: center; border-bottom: 2px solid #0f0; }}
                      
                      /* Disk Usage Bar */
                      .disk-box {{ margin: 20px 0; border: 1px solid #333; padding: 10px; background: #111; }}
                      .progress-bg {{ background: #333; height: 25px; width: 100%; border-radius: 5px; overflow: hidden; }}
                      .progress-bar {{ background: linear-gradient(90deg, #0f0, #ff0); height: 100%; width: {used_percent}%; transition: width 0.5s; }}
                      
                      table {{ width: 100%; border-collapse: collapse; margin-top: 20px; }}
                      th, td {{ border: 1px solid #0f0; padding: 10px; text-align: left; }}
                      th {{ background: #002200; }}
                      a {{ color: #0ff; text-decoration: none; }}
                      
                      .boot-log {{ background: #111; color: #aaa; padding: 10px; border: 1px solid #444; height: 150px; overflow-y: scroll; font-size: 0.9em; }}
                  </style>
              </head>
              <body>
                  <div class='container'>
                      <h1>🖥️ MEGA SERVER STATUS: ONLINE</h1>
                      
                      <div class='disk-box'>
                          <h3>💾 Disk Usage (Expanded Capacity)</h3>
                          <div class='progress-bg'>
                              <div class='progress-bar'></div>
                          </div>
                          <p>{used // (1024**3)} GB Used / {total // (1024**3)} GB Total ({used_percent:.1f}%)</p>
                      </div>

                      <div class='disk-box'>
                          <h3>⚡ Last Reboot Sequence</h3>
                          <div class='boot-log'>
                              SYSTEM REBOOT INITIATED...<br>
                              Stopping Services... [OK]<br>
                              Unmounting... [OK]<br>
                              Booting Kernel... [OK]<br>
                              Filesystem Check... [PASSED]<br>
                              Services Started... [OK]<br>
                              System Ready at {datetime.datetime.now()}
                          </div>
                      </div>

                      <h3>📂 Active Files (Top 30 Recent)</h3>
                      <table>
                          <tr><th>File</th><th>Path</th><th>Size</th><th>Action</th></tr>
                          {files_html}
                      </table>
                  </div>
              </body>
              </html>
              """
              
              with open("index.html", "w", encoding="utf-8") as f: f.write(html)

          if __name__ == "__main__":
              generate_dashboard()
          EOF
          
          python3 mega_processor.py

      # 4. 저장소 반영 (LFS 대용량 처리)
      - name: Deploy to Repository
        run: |
          echo "=== 🚀 Syncing Massive Data ==="
          git lfs install
          git lfs track "*.dat" "*.log"
          
          git add .
          git commit -m "Mega Server: Rebooted & MB Data Added [$(date)]" || echo "No changes"
          git pull --rebase origin main || echo "Rebase Handled"
          git push origin main || echo "Push Handled"

      # 5. 릴리즈 패키징 (대용량 ZIP)
      - name: Create Mega Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y.%m.%d-%H%M)"
          ZIP_NAME="Server_Dump_${TAG}.zip"
          zip -r "$ZIP_NAME" File_Server_Root index.html
          
          gh release create "$TAG" "$ZIP_NAME" \
            --title "Server Reboot $TAG" \
            --notes "System rebooted. Capacity optimized. Massive files generated." \
            --target main || echo "Release skipped"

      # 6. Pages 배포
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: mega-server-job
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
