name: Linux Manual PDF Server & Auto-Fix

on:
  # ⏰ 10분마다 자동 실행 (PDF 서버 가동)
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf-server-and-manual:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Repository Checkout
        uses: actions/checkout@v4

      - name: 1. Install PDF Server Engine & Fonts
        run: |
          echo "=========================================="
          echo "    🛠️ INSTALLING PDF RENDER SERVER       "
          echo "=========================================="
          
          sudo apt-get update
          # Pandoc(변환기) 및 TexLive(PDF엔진), 한글 폰트 설치
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended fonts-nanum xzdec
          
          echo "✅ PDF Server Engine Installed."

      - name: 2. Initialize Workspace
        run: |
          mkdir -pv output_data/manuals/pdf
          mkdir -pv output_data/manuals/markdown
          mkdir -pv output_data/logs
          mkdir -pv output_data/source

      # 🟢 [핵심] 렌더링 오류 수정을 위한 'Heredoc' 방식 적용
      # 특수문자 충돌을 방지하기 위해 'EOF'를 사용하여 안전하게 작성
      - name: 3. Generate Error-Free Markdown Manual
        run: |
          echo "::: Generating Clean Markdown Manual :::"
          
          MD_FILE="output_data/manuals/markdown/Linux_Master_Guide.md"
          
          # 아래 'EOF' 구간 안의 내용은 YAML 문법의 영향을 받지 않고 그대로 파일로 저장됩니다.
          cat <<'EOF' > $MD_FILE
          ---
          title: "Linux Master Comprehensive Manual"
          author: "Auto-Generated by GitHub Actions"
          date: "2026-01-07"
          geometry: margin=1in
          mainfont: "NanumGothic"
          ---

          # 🐧 Linux Master Manual (Expert Edition)

          ## 1. File System Commands
          | Command | Description | Usage Example |
          | :--- | :--- | :--- |
          | **ls** | List directory contents | `ls -alH` (Show hidden & links) |
          | **cp** | Copy files/dirs | `cp -rv /src /dest` |
          | **rm** | Remove (Caution!) | `rm -rf /path/to/destroy` |
          | **chmod** | Change Mode (Perms) | `chmod 755 run.sh` |

          ## 2. Process Management (Zombie Lab)
          This section covers process states including Zombies (Defunct).

          ### Zombie Process C Code
          ```c
          #include <stdlib.h>
          #include <unistd.h>
          // This code creates a zombie by exiting child while parent sleeps
          int main() {
              if (fork() > 0) {
                  sleep(10); // Parent ignores child -> Zombie created
              } else {
                  exit(0);   // Child dies -> Becomes <defunct>
              }
              return 0;
          }
          ```
          
          ## 3. Network & Server Ops
          | Command | Description | Example |
          | :--- | :--- | :--- |
          | **netstat** | Network statistics | `netstat -tulpn` |
          | **curl** | Data transfer | `curl -O http://site.com/file` |
          | **ssh** | Remote Login | `ssh user@192.168.1.1` |
          
          > **Note:** Always check firewall status with `ufw status` before opening ports.
          EOF
          
          # 날짜 정보 추가 (동적 데이터는 별도 append)
          echo -e "\n\n_Generated at: $(date)_" >> $MD_FILE
          
          echo "✅ Markdown Generated without Errors."

      - name: 4. Run Zombie Process & Log (Live Server)
        run: |
          echo "=== 🧟 Running Zombie Simulation ==="
          
          # C 코드 파일 생성
          cat <<'EOF' > output_data/source/zombie.c
          #include <stdlib.h>
          #include <unistd.h>
          #include <stdio.h>
          int main() {
            printf("Spawning Process...\n");
            pid_t pid = fork();
            if (pid > 0) {
              printf("Parent (PID %d) Sleeping...\n", getpid());
              sleep(5);
              printf("Parent Waking Up.\n");
            } else {
              printf("Child (PID %d) Exiting (Zombie Mode)...\n", getpid());
              exit(0);
            }
            return 0;
          }
          EOF
          
          # 컴파일 및 실행
          gcc output_data/source/zombie.c -o output_data/source/zombie_exec
          ./output_data/source/zombie_exec &
          
          sleep 2
          
          echo "=== 📸 Capturing Process Table (Evidence) ==="
          # 로그 파일에 좀비 프로세스 상태 기록
          ps aux | grep 'Z\|defunct' | grep -v grep > output_data/logs/zombie_evidence.log || echo "No Zombie Found" >> output_data/logs/zombie_evidence.log
          cat output_data/logs/zombie_evidence.log

      - name: 5. PDF Server: Convert & Publish
        run: |
          echo "=== 🔄 Converting Markdown to PDF ==="
          
          INPUT_MD="output_data/manuals/markdown/Linux_Master_Guide.md"
          OUTPUT_PDF="output_data/manuals/pdf/Linux_Master_Guide.pdf"
          
          # Pandoc을 사용하여 PDF 변환 (한글 폰트 적용)
          # xelatex 엔진을 사용하여 유니코드(한글) 호환성 확보
          pandoc "$INPUT_MD" -o "$OUTPUT_PDF" --pdf-engine=xelatex -V mainfont="NanumGothic" || true
          
          if [ -f "$OUTPUT_PDF" ]; then
            echo "✅ PDF Generation Successful: $OUTPUT_PDF"
            ls -lh "$OUTPUT_PDF"
          else
            echo "❌ PDF Generation Failed (Check Logs)"
          fi

      - name: 6. Download Official Manuals
        run: |
          echo "=== 📥 Fetching External Docs ==="
          wget -q -O output_data/manuals/gnu_coreutils.pdf https://www.gnu.org/software/coreutils/manual/coreutils.pdf || true

      - name: 7. Commit & Push (Source Backup)
        run: |
          git config --global user.name "PDF-Server-Bot"
          git config --global user.email "bot@noreply.github.com"
          
          git add output_data/
          git commit -m "Server Update: PDF & Logs Generated [$(date)]" || echo "No changes"
          git push

      # 🟢 [추가 기능] GitHub Artifact Server (파일 다운로드 제공)
      # 이 단계가 완료되면 Actions 실행 화면 하단에서 파일을 직접 다운로드할 수 있습니다.
      - name: 8. Upload Artifacts (Download Server)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Manuals-and-Logs
          path: output_data/
          retention-days: 5
