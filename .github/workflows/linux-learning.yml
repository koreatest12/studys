name: Linux Manual Visual Log & Auto-Upload

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 🟢 [필수] 토큰 없이 파일 업로드를 위한 권한 설정
permissions:
  contents: write

jobs:
  visual-download-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Repository Checkout
        uses: actions/checkout@v4

      - name: 1. Init & Environment Visualization
        run: |
          set +e
          echo "=========================================="
          echo "    🚀 STARTING LINUX MASTERY LAB v2.0    "
          echo "=========================================="
          
          # 현재 위치 및 사용자 시각화
          echo "root@github-runner:~$ whoami"
          whoami
          echo ""
          echo "root@github-runner:~$ pwd"
          pwd
          echo ""
          
          # 저장 폴더 생성 및 확인
          echo "::: Creating Output Directories :::"
          mkdir -pv output_data/logs
          mkdir -pv output_data/manuals
          echo "✅ Directories Created."

      - name: 2. System Status Dashboard (Real-time)
        run: |
          # tee 명령어를 사용하여 화면 출력과 파일 저장을 동시에 수행합니다.
          echo "=========================================="
          echo "       🖥️ SYSTEM STATUS DASHBOARD         "
          echo "=========================================="
          
          echo "[1] Kernel Information:"
          uname -a | tee output_data/logs/system_info.txt
          echo ""
          
          echo "[2] CPU Details (Summary):"
          lscpu | head -n 10 | tee -a output_data/logs/system_info.txt
          echo ""
          
          echo "[3] Memory Usage:"
          free -h | tee -a output_data/logs/system_info.txt
          echo ""
          
          echo "[4] Disk Space:"
          df -Th | grep "^/dev" | tee -a output_data/logs/system_info.txt

      - name: 3. Downloading Manuals (Progress Visualization)
        run: |
          echo "=========================================="
          echo "       📥 DOWNLOADING OFFICIAL DOCS       "
          echo "=========================================="
          
          # GNU Coreutils (ls, cp 등) 매뉴얼
          echo "1️⃣ Downloading GNU Coreutils Manual..."
          # --show-progress: 진행바 표시
          wget --show-progress -O output_data/manuals/gnu_coreutils.pdf https://www.gnu.org/software/coreutils/manual/coreutils.pdf || true
          echo "   👉 File Saved: $(ls -sh output_data/manuals/gnu_coreutils.pdf)"
          echo ""

          # Bash Reference 매뉴얼
          echo "2️⃣ Downloading Bash Reference Manual..."
          wget --show-progress -O output_data/manuals/bash_ref.pdf https://www.gnu.org/software/bash/manual/bash.pdf || true
          echo "   👉 File Saved: $(ls -sh output_data/manuals/bash_ref.pdf)"
          echo ""

          # Linux Kernel Text (텍스트 내용은 화면에 일부 출력)
          echo "3️⃣ Fetching Linux Kernel Docs (HTML Header)..."
          curl -I https://www.kernel.org/doc/html/latest/ > output_data/manuals/kernel_header.txt || true
          echo "   👉 Content Preview (First 5 lines):"
          echo "-------------------------------------"
          cat output_data/manuals/kernel_header.txt | head -n 5
          echo "-------------------------------------"

      - name: 4. Network & Connectivity Check
        run: |
          echo "=========================================="
          echo "       🌐 NETWORK DIAGNOSTICS             "
          echo "=========================================="
          
          echo "ping google.com ..."
          # 핑 결과를 화면에 보여주고 로그에도 저장
          ping -c 3 google.com | tee output_data/logs/network.log || echo "⚠️ Ping Blocked by Firewall (Expected)"
          
          echo ""
          echo "Checking Public IP..."
          curl -s ifconfig.me | tee -a output_data/logs/network.log
          echo ""

      - name: 5. Git Push Visualization
        run: |
          echo "=========================================="
          echo "       🚀 UPLOADING TO REPOSITORY         "
          echo "=========================================="
          
          git config --global user.name "Visual-Log-Bot"
          git config --global user.email "bot@noreply.github.com"
          
          echo "::: Git Status (Before Add) :::"
          git status
          
          git add output_data/
          
          echo "::: Git Commit :::"
          git commit -m "Auto-Update: Visual Logs & Manuals [$(date)]" || echo "⚠️ No changes to commit"
          
          echo "::: Git Push :::"
          git push
          
          echo ""
          echo "✅ ALL TASKS COMPLETED SUCCESSFULLY."
          echo "📂 Check 'output_data' folder in your repo!"
