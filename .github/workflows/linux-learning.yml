name: Linux Manual PDF Server (Clean & Robust)

on:
  # ⏰ 10분마다 자동 실행
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 🟢 [필수] 권한 설정
permissions:
  contents: write

jobs:
  pdf-server-and-manual:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🟢 [수정됨] 폰트 호환성 강화 및 재시도 로직 적용
      - name: 1. System Update & Install Dependencies
        run: |
          echo "=== 🛠️ SYSTEM SETUP (Robust Mode) ==="
          
          # 패키지 업데이트 및 설치 (에러 발생 시 1회 재시도)
          sudo apt-get update || sudo apt-get update
          
          # fonts-noto-cjk: 나눔고딕보다 커버리지가 넓은 구글 Noto 폰트 추가
          # texlive-xetex: PDF 엔진
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-latex-base \
            texlive-fonts-recommended \
            texlive-xetex \
            fonts-nanum \
            fonts-noto-cjk \
            xzdec \
            whois
          
          echo "::: Verifying XeLaTeX :::"
          if command -v xelatex >/dev/null; then
            echo "✅ XeLaTeX Installed: $(xelatex --version | head -n 1)"
          else
            echo "❌ XeLaTeX Install Failed."
            exit 1
          fi

      - name: 2. Initialize Workspace
        run: |
          mkdir -pv output_data/manuals/pdf
          mkdir -pv output_data/manuals/markdown
          mkdir -pv output_data/logs
          mkdir -pv output_data/source

      # 🟢 [수정됨] 이모지(🐧) 제거 -> 경고 메시지 원천 차단
      - name: 3. Generate Error-Free Markdown Manual
        run: |
          echo "::: Generating Clean Markdown Manual :::"
          
          MD_FILE="output_data/manuals/markdown/Linux_Master_Guide.md"
          
          # 이모지를 제거하고 텍스트로 대체하여 PDF 변환 시 경고를 방지합니다.
          cat <<'EOF' > $MD_FILE
          ---
          title: "Linux Master Manual (Expert)"
          author: "Auto-Generated by GitHub Actions"
          date: "2026-01-07"
          geometry: margin=1in
          mainfont: "NanumGothic"
          ---

          # [Linux] Master Comprehensive Manual

          ## 1. File System Commands
          | Command | Description | Usage Example |
          | :--- | :--- | :--- |
          | **ls** | List directory contents | `ls -alH` (Show hidden & links) |
          | **cp** | Copy files/dirs | `cp -rv /src /dest` |
          | **rm** | Remove (Caution!) | `rm -rf /path/to/destroy` |
          | **chmod** | Change Mode (Perms) | `chmod 755 run.sh` |

          ## 2. User & Password Management
          | Command | Description | Usage Example |
          | :--- | :--- | :--- |
          | **passwd** | Change user password | `passwd username` (Interactive) |
          | **chpasswd** | Batch update passwords | `echo "user:pass" \| chpasswd` |
          | **useradd** | Create new user | `useradd -m -s /bin/bash user1` |

          ## 3. Process Management (Zombie Lab)
          This section covers process states including Zombies (Defunct).

          ### Zombie Process C Code
          ```c
          #include <stdlib.h>
          #include <unistd.h>
          int main() {
              // Fork creates a child process
              if (fork() > 0) {
                  sleep(10); // Parent ignores child -> Zombie created
              } else {
                  exit(0);   // Child dies -> Becomes <defunct>
              }
              return 0;
          }
          ```
          EOF
          
          echo -e "\n\n_Last Updated: $(date)_" >> $MD_FILE
          echo "✅ Markdown Generated (Clean Text Only)."

      - name: 4. Simulation:User & Password
        run: |
          echo "=== 🔑 User Simulation ==="
          sudo useradd -m test_lab_user || true
          echo "test_lab_user:SecretPass123!" | sudo chpasswd
          
          # 로그 기록 (보안상 해시 일부만 기록)
          sudo grep "test_lab_user" /etc/shadow | head -c 20 > output_data/logs/passwd_audit.log
          echo "..." >> output_data/logs/passwd_audit.log
          echo "✅ User Simulation Complete."

      - name: 5. Simulation:Zombie Process
        run: |
          echo "=== 🧟 Zombie Simulation ==="
          
          SOURCE_FILE="output_data/source/zombie.c"
          EXEC_FILE="output_data/source/zombie_exec"
          
          # 소스 파일 생성
          cat <<'EOF' > $SOURCE_FILE
          #include <stdlib.h>
          #include <unistd.h>
          #include <stdio.h>
          int main() {
            printf("Process Started...\n");
            pid_t pid = fork();
            if (pid > 0) {
              sleep(5);
            } else {
              exit(0);
            }
            return 0;
          }
          EOF
          
          # 컴파일 및 실행
          gcc $SOURCE_FILE -o $EXEC_FILE
          ./$EXEC_FILE &
          
          sleep 2
          # 좀비 프로세스 캡처
          ps aux | grep 'Z\|defunct' | grep -v grep > output_data/logs/zombie_evidence.log || echo "Zombie capture missed" >> output_data/logs/zombie_evidence.log
          cat output_data/logs/zombie_evidence.log
          echo "✅ Zombie Simulation Complete."

      - name: 6. PDF Server:Convert & Publish
        run: |
          echo "=== 🔄 Converting Markdown to PDF ==="
          
          INPUT_MD="output_data/manuals/markdown/Linux_Master_Guide.md"
          OUTPUT_PDF="output_data/manuals/pdf/Linux_Master_Guide.pdf"
          
          # NanumGothic 폰트를 사용하여 한글 깨짐 방지
          # 이모지가 제거되었으므로 경고 없이 깔끔하게 변환됩니다.
          pandoc "$INPUT_MD" -o "$OUTPUT_PDF" \
            --pdf-engine=xelatex \
            -V mainfont="NanumGothic" \
            -V geometry:margin=1in \
            || true
          
          if [ -f "$OUTPUT_PDF" ]; then
            echo "✅ PDF Generated Successfully: $(ls -lh $OUTPUT_PDF)"
          else
            echo "❌ PDF Generation Failed."
            exit 1
          fi

      - name: 7. Download External Manuals
        run: |
          echo "=== 📥 Fetching External Docs ==="
          # 네트워크 불안정 대비 재시도 옵션(-t 3) 추가
          wget -q -t 3 -O output_data/manuals/gnu_coreutils.pdf https://www.gnu.org/software/coreutils/manual/coreutils.pdf || true
          wget -q -t 3 -O output_data/manuals/man_passwd.html https://man7.org/linux/man-pages/man1/passwd.1.html || true

      - name: 8. Update Repository (Robust Sync)
        run: |
          echo "=== 🚀 Syncing with Repository ==="
          git config --global user.name "Linux-Lab-Bot"
          git config --global user.email "bot@noreply.github.com"
          
          git add output_data/
          git commit -m "Auto-Update: Clean PDF & Logs [$(date)]" || echo "⚠️ No changes to commit"
          
          # Pull Rebase로 충돌 방지
          git pull --rebase origin main || echo "⚠️ Rebase skipped, might conflict."
          git push || echo "⚠️ Push failed (concurrent modification), skipping."

      - name: 9. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Lab-Full-Package
          path: output_data/
          retention-days: 5
