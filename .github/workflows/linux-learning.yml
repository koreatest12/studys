name: Linux Mastery Lab & Auto-Save

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 🟢 [중요] 토큰 없이 저장소에 파일을 쓰기 위한 권한 설정
permissions:
  contents: write

jobs:
  linux-lab-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Init & Safety Setup
        run: |
          set +e 
          echo "✅ Error Ignore Mode Activated"

      # --- [리눅스 실습: 파일 시스템] ---
      - name: 2. File System Operations
        run: |
          echo "=== 📂 Creating Directories ==="
          # 결과물을 저장할 output 폴더 생성
          mkdir -pv output_data/logs || true
          mkdir -pv output_data/config || true

          echo "=== 📝 Creating Result Files ==="
          # 실습 결과 파일 생성
          echo "Linux Lab Started: $(date)" > output_data/summary.txt
          echo "System Check: OK" >> output_data/summary.txt
          
          # 더미 로그 생성
          for i in {1..5}; do echo "Log $i: Processed" >> output_data/logs/app.log; done || true

      # --- [리눅스 실습: 시스템 정보] ---
      - name: 3. System Info Collection
        run: |
          echo "=== 💾 System Stats ==="
          # 시스템 정보를 파일로 저장
          echo "[Disk Info]" >> output_data/summary.txt
          df -h >> output_data/summary.txt || true
          
          echo "[Memory Info]" >> output_data/summary.txt
          free -h >> output_data/summary.txt || true
          
          echo "[CPU Info]" >> output_data/summary.txt
          lscpu | head -n 10 >> output_data/summary.txt || true

      # --- [리눅스 실습: 네트워크 & 에러 처리] ---
      - name: 4. Network & Advanced Ops
        run: |
          echo "=== 🌐 Network Check ==="
          # 에러가 나도 파일에 기록하고 넘어감
          ping -c 3 8.8.8.8 >> output_data/logs/network.log 2>&1 || echo "Ping blocked but continued" >> output_data/logs/network.log
          
          echo "=== 🔍 Text Processing ==="
          # 로그 라인 수 카운트 저장
          wc -l output_data/logs/app.log >> output_data/summary.txt || true

      # --- [최종 단계: 저장소로 파일 자동 업로드 (토큰 불필요)] ---
      - name: 5. Commit & Push Changes
        run: |
          echo "=== 🚀 Prepare to Push to koreatest12/studys ==="
          
          # 1. 깃 설정 (가상 유저)
          git config --global user.name "Linux-Lab-Bot"
          git config --global user.email "bot@noreply.github.com"
          
          # 2. 변경된 파일 추가 (output_data 폴더)
          git add output_data/
          
          # 3. 커밋 (변경사항이 없으면 에러 안 나게 처리)
          git commit -m "Results: Linux Lab Auto-Save [$(date)]" || echo "⚠️ No changes to commit"
          
          # 4. 푸시 (GITHUB_TOKEN 사용 - 별도 인증 불필요)
          git push
          echo "✅ Successfully pushed results to repository!"
