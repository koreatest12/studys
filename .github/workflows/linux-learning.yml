name: Ultra Mega Server V14 (Stable Architect)

on:
  schedule:
    - cron: '*/15 * * * *' # 안정성을 위해 15분 간격 권장
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "mega-server-stable"
  cancel-in-progress: true

jobs:
  stable-architect-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. 🏁 초기화
      - name: 📥 Initialize System
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 최신만 가져와서 용량 절약

      # 2. 🛡️ [Fix] Jekyll 빌드 오류 방지 설정 (필수)
      - name: ⚙️ Configure Jekyll Excludes
        run: |
          # Jekyll이 외부 소스 코드를 해석하지 않도록 설정 파일 생성
          cat <<EOF > _config.yml
          title: Ultra Mega Server V14
          theme: jekyll-theme-hacker
          exclude:
            - external_studys_data/
            - node_modules/
            - vendor/
            - .github/
            - "*.json"
            - "*.xml"
          EOF
          echo "✅ Jekyll Configuration Applied (Ignoring Source Code)"

      # 3. 🧹 [System] 초극강 디스크 정리 (Ultra Clean)
      - name: 🧹 Execute Ultra Disk Cleanup
        run: |
          echo "=== 🚨 STARTING ULTRA CLEANUP ==="
          df -h /
          
          # 불필요한 대형 도구 제거 (약 25GB+ 확보 시도)
          sudo rm -rf /usr/local/lib/android # Android SDK
          sudo rm -rf /usr/share/dotnet      # .NET Core
          sudo rm -rf /opt/ghc               # Haskell
          sudo rm -rf /opt/hostedtoolcache   # Cached Tools
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Docker 정리
          docker system prune -af
          docker volume prune -f
          
          # APT 캐시 정리
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "=== ✨ CLEANUP COMPLETE ==="
          df -h /
          echo "✅ Maximum Capacity Secured."

      # 4. 🔗 [External] 외부 리포지토리 안전 통합
      - name: 📡 Integrate External Repo (Safe Mode)
        run: |
          # 얕은 복사(depth 1)로 용량 절약
          git clone --depth 1 https://github.com/koreatest12/studys.git external_studys_data
          
          # .git 폴더 제거 (용량 확보 및 서브모듈 오류 방지)
          rm -rf external_studys_data/.git
          
          echo "✅ External Data Loaded (Lightweight Mode)."

      # 5. 🏭 [Engine] 스마트 데이터 생성 (공간 감지형)
      - name: 🏗️ Run Smart Architect Engine
        run: |
          # Python 스크립트 작성
          cat <<'EOF' > mega_architect_v14.py
          import os
          import random
          import datetime
          import shutil
          import json
          import sqlite3

          # === [1] 스마트 용량 감지 함수 ===
          def check_disk_space(min_gb=1.0):
              total, used, free = shutil.disk_usage("/")
              free_gb = free / (1024**3)
              print(f"   [Disk Check] Free Space: {free_gb:.2f} GB")
              return free_gb > min_gb

          # === [2] 서비스 아키텍처 정의 ===
          services = ["Auth_Core", "Payment_Gateway", "User_Data", "Log_Vault", "AI_Model_Server"]
          base_dir = "Enterprise_Services"
          os.makedirs(base_dir, exist_ok=True)

          print(">> 🚀 Starting Smart Data Generation...")

          # === [3] 데이터베이스(SQLite) 생성 ===
          db_path = "enterprise_v14.db"
          conn = sqlite3.connect(db_path)
          cursor = conn.cursor()
          
          # 테이블 생성
          cursor.execute("CREATE TABLE IF NOT EXISTS system_logs (id INTEGER PRIMARY KEY, service TEXT, msg TEXT, timestamp DATETIME)")
          cursor.execute("CREATE TABLE IF NOT EXISTS transactions (tx_id TEXT, amount REAL, status TEXT)")
          
          total_files = 0
          
          # === [4] 서비스별 데이터 생성 (공간이 있을 때만) ===
          for svc in services:
              svc_dir = f"{base_dir}/{svc}"
              os.makedirs(svc_dir, exist_ok=True)
              
              # 로그 생성 (DB)
              for _ in range(50):
                  cursor.execute("INSERT INTO system_logs (service, msg, timestamp) VALUES (?, ?, ?)", 
                                (svc, f"System check OK for {svc}", datetime.datetime.now()))
              
              # 파일 생성 (공간 체크)
              if check_disk_space(min_gb=2.0): # 2GB 이상 남았을 때만 대용량 파일 생성
                  print(f"   -> Generating High-Res Assets for {svc}...")
                  for i in range(3):
                      # 10MB ~ 30MB로 사이즈 조절 (안전성 확보)
                      size_mb = random.randint(10, 30)
                      fname = f"{svc_dir}/asset_{i}_{datetime.datetime.now().strftime('%H%M')}.dat"
                      try:
                          with open(fname, "wb") as f:
                              f.seek((size_mb * 1024 * 1024) - 1)
                              f.write(b'\0')
                          total_files += 1
                      except OSError:
                          print("   ⚠️ Disk Full! Stopping generation.")
                          break
              else:
                  print(f"   ⚠️ Low Disk Space. Skipping large files for {svc}.")
                  # 작은 텍스트 파일로 대체
                  with open(f"{svc_dir}/status.txt", "w") as f:
                      f.write("Service Active (Low Storage Mode)")

          conn.commit()
          conn.close()

          # === [5] 어드민 대시보드 생성 ===
          total, used, free = shutil.disk_usage("/")
          used_p = (used / total) * 100
          
          html = f"""
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Mega Server V14 Architect</title>
              <style>
                  body {{ background: #1a1a2e; color: #e94560; font-family: monospace; padding: 20px; }}
                  .container {{ max-width: 1000px; margin: 0 auto; border: 2px solid #16213e; padding: 20px; background: #0f3460; }}
                  h1 {{ border-bottom: 2px solid #e94560; padding-bottom: 10px; }}
                  .stat-box {{ background: #1a1a2e; padding: 15px; margin: 10px 0; border-radius: 5px; }}
                  .bar-bg {{ background: #16213e; height: 20px; width: 100%; }}
                  .bar-fill {{ background: linear-gradient(90deg, #e94560, #ffbd69); height: 100%; width: {used_p}%; }}
                  table {{ width: 100%; border-collapse: collapse; margin-top: 20px; }}
                  th, td {{ border: 1px solid #16213e; padding: 10px; text-align: left; color: #fff; }}
                  th {{ background: #16213e; color: #e94560; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🚀 MEGA SERVER V14: STABLE ARCHITECT</h1>
                  <div class="stat-box">
                      <h3>💾 Disk Storage (Smart Managed)</h3>
                      <div class="bar-bg"><div class="bar-fill"></div></div>
                      <p>{used // (1024**3)} GB Used / {total // (1024**3)} GB Total ({used_p:.1f}%)</p>
                      <p>Status: {"🟢 STABLE" if free > 1024**3 else "🔴 CRITICAL"}</p>
                  </div>
                  
                  <h3>📂 Service Mesh Status</h3>
                  <table>
                      <tr><th>Service Name</th><th>Status</th><th>Files Generated</th></tr>
          """
          
          for svc in services:
              html += f"<tr><td>{svc}</td><td>Active</td><td>Checked</td></tr>"
              
          html += """
                  </table>
                  <p><i>* System optimized to prevent crash. External data integration active.</i></p>
              </div>
          </body>
          </html>
          """
          
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          
          python3 mega_architect_v14.py

      # 6. 🚀 [Deploy] 최종 배포 (LFS 설정 포함)
      - name: 🚀 Deploy to GitHub Pages
        run: |
          git config --global user.name "Architect-Bot"
          git config --global user.email "bot@megaserver.internal"
          
          # LFS 설치
          git lfs install
          git lfs track "*.dat" "*.db" "*.dll"
          
          git add .
          git commit -m "🚀 V14 Stable: Fixed Liquid Errors & Disk Overflow [$(date)]" || echo "No changes"
          git pull --rebase origin main || echo "Rebase handled"
          git push origin main || echo "Push handled"

      # 7. Pages 빌드
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: stable-architect-ops
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
