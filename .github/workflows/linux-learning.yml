name: Linux System Update & Data Collection Script

on:
  # ⏰ 10분마다 실행 (데이터 수집 및 업데이트)
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  system-update-job:
    runs-on: ubuntu-latest
    steps:
      # 1. 초기화 및 브랜치 동기화
      - name: Checkout & Force Sync
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force Clean Build
        run: |
          git config --global user.name "System-Manager-Bot"
          git config --global user.email "bot@noreply.github.com"
          git checkout -B main origin/main
          # 기존 데이터 정리 (새로운 업데이트를 위해)
          rm -rf output_data index.html
          echo "✅ Clean Environment Prepared."

      # 🟢 [핵심 1] 마스터 관리 스크립트 생성 (Shell Script)
      - name: Create System Manager Script
        run: |
          cat <<'EOF' > system_manager.sh
          #!/bin/bash
          set -e # 에러 발생 시 중단

          echo "========================================"
          echo "   🚀 SYSTEM UPDATE & COLLECTION START  "
          echo "========================================"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          # [1] 디렉토리 구조 생성
          mkdir -pv output_data/{database,source_code,manuals,logs,system_reports}
          mkdir -pv output_data/manuals/{pdf,official_docs}
          mkdir -pv output_data/source_code/{java,python}

          # [2] 시스템 패키지 업데이트 및 도구 설치
          echo "::: 🛠️ Updating System Packages :::"
          sudo apt-get update -y
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-xetex fonts-nanum fonts-noto-cjk sqlite3 wget curl
          
          # [3] 시스템 데이터 수집 (Data Collection)
          echo "::: 📊 Collecting System Metrics :::"
          REPORT_FILE="output_data/system_reports/report_${TIMESTAMP}.txt"
          
          echo "--- System Snapshot [$TIMESTAMP] ---" > $REPORT_FILE
          echo "[Disk Usage]" >> $REPORT_FILE
          df -h >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "[Memory Usage]" >> $REPORT_FILE
          free -h >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "[Top Processes]" >> $REPORT_FILE
          ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%cpu | head -n 10 >> $REPORT_FILE

          # [4] 외부 자료(매뉴얼) 업데이트
          echo "::: 📚 Updating Manual Library :::"
          wget -q -O output_data/manuals/official_docs/gnu_bash.pdf https://www.gnu.org/software/bash/manual/bash.pdf || true
          wget -q -O output_data/manuals/official_docs/gnu_coreutils.pdf https://www.gnu.org/software/coreutils/manual/coreutils.pdf || true

          # [5] Python 데이터 프로세서 실행 (DB & Web)
          echo "::: 🧠 Running Data Processor :::"
          python3 data_processor.py

          echo "✅ System Update & Collection Finished."
          EOF
          
          chmod +x system_manager.sh

      # 🟢 [핵심 2] 데이터 처리 엔진 생성 (Python Script)
      - name: Create Data Processor Script
        run: |
          cat <<'EOF' > data_processor.py
          import sqlite3, os, datetime, random

          # [1] 대량 데이터베이스 생성 및 업데이트
          def generate_massive_db():
              print(">> Generating Massive Database...")
              db_path = "output_data/database/enterprise.db"
              conn = sqlite3.connect(db_path)
              cur = conn.cursor()
              
              # DDL (테이블 생성)
              cur.execute("CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY, name TEXT, email TEXT, role TEXT, joined_at TIMESTAMP);")
              cur.execute("CREATE TABLE IF NOT EXISTS logs (id INTEGER PRIMARY KEY, ip TEXT, action TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);")
              
              # DML (데이터 대량 삽입)
              users = [f'user_{i:04d}' for i in range(1, 501)] # 500명
              for u in users:
                  cur.execute("INSERT INTO users (name, email, role) VALUES (?, ?, ?)", (u, f"{u}@sys.com", random.choice(['Admin','User','Guest'])))
              
              actions = ['LOGIN', 'LOGOUT', 'UPDATE', 'DELETE', 'VIEW']
              for _ in range(3000): # 로그 3000건
                  cur.execute("INSERT INTO logs (ip, action) VALUES (?, ?)", (f"192.168.1.{random.randint(1,255)}", random.choice(actions)))
              
              conn.commit()
              
              # SQL 덤프 저장
              with open("output_data/database/full_dump.sql", "w") as f:
                  for line in conn.iterdump(): f.write(f"{line}\n")
              conn.close()

          # [2] 웹 대시보드(Index.html) 생성
          def generate_dashboard():
              print(">> Building Web Dashboard...")
              html = """
              <!DOCTYPE html>
              <html>
              <head>
                  <meta charset='utf-8'>
                  <title>System Update Center</title>
                  <style>
                      body { background: #1a1a1a; color: #ddd; font-family: sans-serif; padding: 20px; }
                      .container { max-width: 1000px; margin: 0 auto; background: #2a2a2a; padding: 20px; border-radius: 8px; }
                      h1 { color: #4CAF50; border-bottom: 2px solid #4CAF50; }
                      table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                      th, td { padding: 10px; border-bottom: 1px solid #444; text-align: left; }
                      th { background: #333; color: #4CAF50; }
                      tr:hover { background: #383838; }
                      a { color: #64b5f6; text-decoration: none; }
                      .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8em; }
                      .sql { background: #ff9800; color: #000; }
                      .log { background: #2196f3; color: #fff; }
                      .pdf { background: #f44336; color: #fff; }
                  </style>
              </head>
              <body>
                  <div class='container'>
                      <h1>🚀 System Update & Data Center</h1>
                      <p>Last Update: """ + datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S") + """ UTC</p>
                      <table>
                          <tr><th>Type</th><th>File Name</th><th>Action</th></tr>
              """
              
              for root, dirs, files in os.walk("output_data"):
                  for file in files:
                      path = os.path.join(root, file).replace(os.sep, '/')
                      ext = file.split('.')[-1]
                      badge = "badge"
                      if ext == 'sql': badge += " sql"
                      elif ext == 'log': badge += " log"
                      elif ext == 'pdf': badge += " pdf"
                      
                      html += f"<tr><td><span class='{badge}'>{ext.upper()}</span></td><td>{file}</td><td><a href='{path}' download>Download</a></td></tr>"
              
              html += "</table></div></body></html>"
              with open("index.html", "w", encoding="utf-8") as f: f.write(html)

          if __name__ == "__main__":
              generate_massive_db()
              generate_dashboard()
          EOF

      # 🟢 [핵심 3] 통합 스크립트 실행 (전체 프로세스 가동)
      - name: Execute System Manager
        run: ./system_manager.sh

      # 4. 저장소 업데이트 (Git Push)
      - name: Update Repository
        run: |
          git add .
          git commit -m "Auto-Script: System Update & Data Collection [$(date)]" || echo "No changes"
          git push origin main || echo "Push skipped"

      # 5. 웹 배포 (GitHub Pages)
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: system-update-job
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
