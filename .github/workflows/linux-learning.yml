name: Linux Full Manual Generator & Scheduler (Every 10m)

on:
  # ⏰ [핵심] 10분마다 자동 실행 (Cron 문법: 분 시 일 월 요일)
  schedule:
    - cron: '*/10 * * * *'
  
  # 수동 실행 및 푸시 시에도 실행
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 🟢 [필수] 토큰 없이 파일 업로드를 위한 권한 설정
permissions:
  contents: write

jobs:
  auto-manual-generation:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Repository Checkout
        uses: actions/checkout@v4

      - name: 1. Init Workspace & Directories
        run: |
          set +e
          echo "=========================================="
          echo "   📚 LINUX AUTO-WIKI GENERATOR STARTED   "
          echo "=========================================="
          
          # 저장 폴더 체계화
          mkdir -pv output_data/manuals/official_docs
          mkdir -pv output_data/manuals/generated_guides
          mkdir -pv output_data/logs
          
          echo "✅ Workspace Ready."

      # --- [기능 1: 리눅스 전체 명령어 매뉴얼 자동 집필] ---
      - name: 2. Generate Comprehensive Linux Manual (Markdown)
        run: |
          echo "::: ✍️ Writing 'Linux_All_In_One_Manual.md' :::"
          
          MANUAL_FILE="output_data/manuals/generated_guides/Linux_Master_Manual.md"
          
          # 매뉴얼 헤더 작성
          cat <<EOF > $MANUAL_FILE
          # 🐧 Linux Comprehensive Command Manual
          > Last Updated: $(date)
          > Auto-generated by GitHub Actions

          ## 1. File System Operations (파일 시스템)
          | Command | Description | Example Code |
          |:---:|:---|:---|
          | **ls** | List directory contents | \`ls -alh\` (Show hidden, list format, human readable) |
          | **cd** | Change directory | \`cd /var/log\` |
          | **pwd** | Print working directory | \`pwd\` |
          | **cp** | Copy files/folders | \`cp -r src_folder dest_folder\` |
          | **mv** | Move or rename | \`mv old.txt new.txt\` |
          | **rm** | Remove files (Careful!) | \`rm -rf /tmp/useless_data\` |
          | **find** | Search for files | \`find /etc -name "*.conf"\` |

          ## 2. System Monitoring (시스템 모니터링)
          | Command | Description | Example Code |
          |:---:|:---|:---|
          | **top** | Real-time process view | \`top -b -n 1\` (Batch mode for scripts) |
          | **htop** | Interactive process viewer | \`htop\` (Visual interface) |
          | **df** | Disk space usage | \`df -Th\` (Type and human readable) |
          | **free** | Memory usage | \`free -h\` |
          | **uptime** | Show running time | \`uptime\` |

          ## 3. Network Operations (네트워크)
          | Command | Description | Example Code |
          |:---:|:---|:---|
          | **ping** | Check connectivity | \`ping -c 4 8.8.8.8\` |
          | **curl** | Transfer data (HTTP) | \`curl -I https://google.com\` |
          | **wget** | Download files | \`wget -O file.zip http://url/file.zip\` |
          | **netstat** | Network statistics | \`netstat -tuln\` (Show listening ports) |
          | **ip** | IP address info | \`ip addr show\` |

          ## 4. Permissions & User (권한 및 유저)
          | Command | Description | Example Code |
          |:---:|:---|:---|
          | **chmod** | Change file modes | \`chmod 755 script.sh\` |
          | **chown** | Change owner | \`chown user:group file.txt\` |
          | **whoami** | Current user | \`whoami\` |
          | **sudo** | Execute as superuser | \`sudo apt update\` |

          ## 5. Advanced & Process (고급 및 프로세스)
          - **Zombie Process Creation Code (C Language)**:
          \`\`\`c
          #include <stdlib.h>
          #include <unistd.h>
          int main() {
            if (fork() > 0) sleep(60); // Parent sleeps
            else exit(0); // Child exits -> Zombie
            return 0;
          }
          \`\`\`
          - **Kill Process**: \`kill -9 [PID]\`
          
          EOF
          
          echo "✅ Manual Generation Complete: $MANUAL_FILE"
          cat $MANUAL_FILE | head -n 10

      # --- [기능 2: 공식 매뉴얼 & 치트시트 다운로드] ---
      - name: 3. Download Official Docs & CheatSheets
        run: |
          echo "=== 📥 Downloading External Resources ==="
          
          # 1. Linux Command Line Cheat Sheet (PDF)
          echo "Downloading Cheat Sheet..."
          wget -q --show-progress -O output_data/manuals/official_docs/linux_cheat_sheet.pdf https://cheatography.com/davechild/cheat-sheets/linux-command-line/pdf/ || true

          # 2. GNU Coreutils Manual (Official)
          echo "Downloading GNU Manual..."
          wget -q --show-progress -O output_data/manuals/official_docs/gnu_coreutils.pdf https://www.gnu.org/software/coreutils/manual/coreutils.pdf || true

          # 3. Kernel Docs (Index)
          echo "Fetching Kernel Docs..."
          curl -s https://www.kernel.org/doc/html/latest/ > output_data/manuals/official_docs/kernel_index.html || true

      # --- [기능 3: 시스템 상태 로그 기록] ---
      - name: 4. Log System Status (Snapshot)
        run: |
          LOG_FILE="output_data/logs/status_$(date +%Y%m%d_%H%M%S).log"
          echo "=== System Snapshot [$(date)] ===" > $LOG_FILE
          echo "--- Disk ---" >> $LOG_FILE
          df -h >> $LOG_FILE
          echo "--- Memory ---" >> $LOG_FILE
          free -h >> $LOG_FILE
          echo "--- Processes (Top 5) ---" >> $LOG_FILE
          ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%cpu | head -n 6 >> $LOG_FILE
          
          echo "✅ Log saved to $LOG_FILE"

      # --- [기능 4: 자동 업로드 (10분마다 반영)] ---
      - name: 5. Git Push (Auto-Update)
        run: |
          echo "=== 🚀 Uploading to Repository ==="
          
          git config --global user.name "Auto-Manual-Bot"
          git config --global user.email "bot@noreply.github.com"
          
          git add output_data/
          
          # 커밋 메시지에 시간 포함
          git commit -m "Auto-Update: Manuals & Logs (10min Schedule) [$(date)]" || echo "⚠️ No changes to commit"
          
          git push
          echo "🎉 Successfully updated repository!"
