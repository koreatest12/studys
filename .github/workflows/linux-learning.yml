name: Linux Manual Download & Auto-Upload

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 🟢 [필수] 토큰 없이 파일 업로드를 위한 권한 설정
permissions:
  contents: write

jobs:
  manual-download-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Init & Safety Setup
        run: |
          set +e 
          echo "✅ Error Ignore Mode Activated"
          # 저장할 디렉토리 생성
          mkdir -pv output_data/logs
          mkdir -pv output_data/manuals

      # --- [기존 기능: 리눅스 명령어 실습] ---
      - name: 2. Linux Command Practice
        run: |
          echo "=== 🐧 Executing Linux Commands ==="
          # 시스템 정보 수집
          echo "[System Info]" > output_data/logs/system_info.txt
          uname -a >> output_data/logs/system_info.txt || true
          lscpu | head -n 10 >> output_data/logs/system_info.txt || true
          
          # 네트워크 테스트 (에러 무시)
          echo "[Network Test]" >> output_data/logs/network_test.txt
          ping -c 3 8.8.8.8 >> output_data/logs/network_test.txt 2>&1 || echo "Ping failed but ignored" >> output_data/logs/network_test.txt

      # --- [신규 기능: 공식 매뉴얼 다운로드] ---
      - name: 3. Download Official Linux Manuals
        run: |
          echo "=== 📥 Downloading Official Manuals ==="
          
          # 1. GNU Coreutils 매뉴얼 (ls, cp, mv 등 기본 명령어 공식 문서)
          # 출처: GNU Operating System Official Site
          echo "Downloading GNU Coreutils Manual..."
          wget -O output_data/manuals/gnu_coreutils_manual.pdf https://www.gnu.org/software/coreutils/manual/coreutils.pdf || true
          
          # 2. Bash Shell 공식 레퍼런스 매뉴얼
          # 출처: GNU Official Site
          echo "Downloading Bash Reference Manual..."
          wget -O output_data/manuals/bash_reference.pdf https://www.gnu.org/software/bash/manual/bash.pdf || true

          # 3. Linux Kernel Admin Guide (HTML을 PDF로 변환하는 대신 주요 텍스트 다운로드 시뮬레이션)
          # 출처: The Linux Kernel Archives
          echo "Fetching Linux Kernel Info..."
          curl -I https://www.kernel.org/doc/html/latest/ >> output_data/manuals/kernel_doc_header.txt || true

          echo "✅ Download Complete. Check 'output_data/manuals' folder."
          ls -l output_data/manuals/

      # --- [업로드 기능: 결과물 저장소 반영] ---
      - name: 4. Upload to Repository (No Token Required)
        run: |
          echo "=== 🚀 Pushing Data to koreatest12/studys ==="
          
          # Git 가상 유저 설정
          git config --global user.name "Manual-Bot"
          git config --global user.email "bot@noreply.github.com"
          
          # 다운로드한 매뉴얼과 로그 파일 추가
          git add output_data/
          
          # 커밋 (변경사항 없으면 에러 방지)
          git commit -m "Auto-Update: Linux Manuals & Logs [$(date)]" || echo "⚠️ No changes to commit"
          
          # 푸시 (permissions: contents: write 덕분에 토큰 없이 가능)
          git push
          echo "🎉 Successfully uploaded manuals and logs!"
