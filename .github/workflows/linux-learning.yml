name: Linux Manual PDF Server (Fix:XeLaTeX)

on:
  # ⏰ 10분마다 자동 실행
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf-server-and-manual:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Repository Checkout
        uses: actions/checkout@v4

      # 🟢 [수정됨] texlive-xetex 패키지 추가로 'xelatex not found' 해결
      - name: 1. Install PDF Server Engine (XeTeX)
        run: |
          echo "=== 🛠️ INSTALLING PDF SERVER & UTILS ==="
          sudo apt-get update
          
          # texlive-xetex : xelatex 엔진 포함 (필수)
          # fonts-nanum : 한글 폰트 (필수)
          # pandoc : 문서 변환기 (필수)
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-xetex fonts-nanum xzdec whois
          
          echo "::: Verifying XeLaTeX Installation :::"
          if command -v xelatex >/dev/null; then
            echo "✅ XeLaTeX is successfully installed."
            xelatex --version | head -n 1
          else
            echo "❌ XeLaTeX NOT found! Install failed."
            exit 1
          fi

      - name: 2. Initialize Workspace
        run: |
          mkdir -pv output_data/manuals/pdf
          mkdir -pv output_data/manuals/markdown
          mkdir -pv output_data/logs
          mkdir -pv output_data/source

      - name: 3. Generate Error-Free Markdown Manual
        run: |
          echo "::: Generating Clean Markdown Manual :::"
          
          MD_FILE="output_data/manuals/markdown/Linux_Master_Guide.md"
          
          # Heredoc을 사용하여 렌더링 오류 방지
          cat <<'EOF' > $MD_FILE
          ---
          title: "Linux Master Comprehensive Manual"
          author: "Auto-Generated by GitHub Actions"
          date: "2026-01-07"
          geometry: margin=1in
          mainfont: "NanumGothic"
          ---

          # 🐧 Linux Master Manual (Expert Edition)

          ## 1. File System Commands
          | Command | Description | Usage Example |
          | :--- | :--- | :--- |
          | **ls** | List directory contents | `ls -alH` (Show hidden & links) |
          | **cp** | Copy files/dirs | `cp -rv /src /dest` |
          | **rm** | Remove (Caution!) | `rm -rf /path/to/destroy` |
          | **chmod** | Change Mode (Perms) | `chmod 755 run.sh` |

          ## 2. User & Password Management
          | Command | Description | Usage Example |
          | :--- | :--- | :--- |
          | **passwd** | Change user password | `passwd username` (Interactive) |
          | **chpasswd** | Batch update passwords | `echo "user:pass" \| chpasswd` |
          | **useradd** | Create new user | `useradd -m -s /bin/bash user1` |

          ## 3. Process Management (Zombie Lab)
          This section covers process states including Zombies (Defunct).

          ### Zombie Process C Code
          ```c
          #include <stdlib.h>
          #include <unistd.h>
          int main() {
              if (fork() > 0) {
                  sleep(10); // Parent ignores child -> Zombie created
              } else {
                  exit(0);   // Child dies -> Becomes <defunct>
              }
              return 0;
          }
          ```
          EOF
          
          echo -e "\n\n_Generated at: $(date)_" >> $MD_FILE
          echo "✅ Markdown Generated."

      - name: 4. Simulate User Creation & Password Change
        run: |
          echo "=== 🔑 User & Password Simulation ==="
          echo "Creating 'test_lab_user'..."
          sudo useradd -m test_lab_user || echo "User exists"
          
          echo "Changing password for 'test_lab_user'..."
          echo "test_lab_user:SecretPass123!" | sudo chpasswd
          
          echo "Verifying Password Hash Change..."
          sudo grep "test_lab_user" /etc/shadow | cut -d: -f1,2 | head -c 20 > output_data/logs/passwd_audit.log
          echo "..." >> output_data/logs/passwd_audit.log
          echo "✅ Password simulation complete."

      - name: 5. Run Zombie Process & Log
        run: |
          echo "=== 🧟 Running Zombie Simulation ==="
          cat <<'EOF' > output_data/source/zombie.c
          #include <stdlib.h>
          #include <unistd.h>
          #include <stdio.h>
          int main() {
            printf("Spawning Process...\n");
            pid_t pid = fork();
            if (pid > 0) {
              printf("Parent (PID %d) Sleeping...\n", getpid());
              sleep(5);
              printf("Parent Waking Up.\n");
            } else {
              printf("Child (PID %d) Exiting (Zombie Mode)...\n", getpid());
              exit(0);
            }
            return 0;
          }
          EOF
          gcc output_data/source/zombie.c -o output_data/source/zombie_exec
          ./output_data/source/zombie_exec &
          sleep 2
          ps aux | grep 'Z\|defunct' | grep -v grep > output_data/logs/zombie_evidence.log || echo "No Zombie Found" >> output_data/logs/zombie_evidence.log
          cat output_data/logs/zombie_evidence.log

      # 🟢 [수정됨] 설치 확인된 XeLaTeX 엔진으로 변환 수행
      - name: 6. PDF Server:Convert & Publish
        run: |
          echo "=== 🔄 Converting Markdown to PDF ==="
          
          INPUT_MD="output_data/manuals/markdown/Linux_Master_Guide.md"
          OUTPUT_PDF="output_data/manuals/pdf/Linux_Master_Guide.pdf"
          
          # --pdf-engine=xelatex 옵션이 이제 정상 작동합니다.
          pandoc "$INPUT_MD" -o "$OUTPUT_PDF" --pdf-engine=xelatex -V mainfont="NanumGothic" || true
          
          if [ -f "$OUTPUT_PDF" ]; then
            echo "✅ PDF Generation Successful: $OUTPUT_PDF"
            ls -lh "$OUTPUT_PDF"
          else
            echo "❌ PDF Generation Failed. Dumping pandoc log..."
            pandoc --version
            exit 1
          fi

      - name: 7. Download Official Manuals
        run: |
          echo "=== 📥 Fetching External Docs ==="
          wget -q -O output_data/manuals/gnu_coreutils.pdf https://www.gnu.org/software/coreutils/manual/coreutils.pdf || true
          wget -q -O output_data/manuals/man_passwd.html https://man7.org/linux/man-pages/man1/passwd.1.html || true

      - name: 8. Commit & Push
        run: |
          git config --global user.name "PDF-Server-Bot"
          git config --global user.email "bot@noreply.github.com"
          git add output_data/
          git commit -m "Fixed: XeLaTeX Installed & PDF Generated [$(date)]" || echo "No changes"
          git push

      - name: 9. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Manuals-Logs-Passwd
          path: output_data/
          retention-days: 5
