name: Linux All-In-One Mastery Lab (Error Safe)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  linux-comprehensive-lab:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Init & Safety Setup
        run: |
          # set +e : 스크립트 도중 에러가 나도 멈추지 않도록 쉘 설정 변경
          set +e 
          echo "✅ Error Ignore Mode Activated (set +e)"

      # 1단계: 파일 시스템 탐색 및 조작 (기초)
      - name: 1. File System Basics (Navigation & Creation)
        run: |
          echo "=== 📍 Path & List ==="
          pwd || true
          ls -al || true
          
          echo "=== 📂 Directory Structure ==="
          # -p: 상위 경로 포함 생성, -v: 상세 출력
          mkdir -pv data/logs/archive || true
          mkdir -pv data/config || true
          mkdir -pv data/backup || true

          echo "=== 📝 File Creation (Touch & Redirection) ==="
          touch data/config/settings.conf || true
          # > : 덮어쓰기, >> : 이어쓰기
          echo "server_port=8080" > data/config/settings.conf || true
          echo "debug_mode=true" >> data/config/settings.conf || true
          
          # 더미 로그 대량 생성
          for i in {1..5}; do echo "Log entry $i: Process started" >> data/logs/app.log; done || true
          echo "CRITICAL: Database Connection Failed" >> data/logs/app.log || true

      # 2단계: 파일 관리 및 아카이빙 (중급)
      - name: 2. File Management (Copy, Move, Archive)
        run: |
          echo "=== 📦 Copy & Move (cp, mv) ==="
          cp -rv data/logs data/backup/ || true
          mv -v data/backup/logs data/backup/logs_old || true
          
          echo "=== 🗜️ Archiving (tar, zip) ==="
          # tar -czvf: Create, Gzip, Verbose, File
          tar -czvf data_backup.tar.gz data/ || true
          # 압축 해제 테스트 (-C: 경로 지정)
          tar -xzvf data_backup.tar.gz -C /tmp/ || true

          echo "=== 🗑️ Deletion Safety Check ==="
          # rm 없는 파일 지우기 시도 (에러 무시 테스트)
          rm non_existent_file.txt || true  
          echo "✅ 'rm' error ignored successfully."

      # 3단계: 권한 및 사용자 관리 (보안)
      - name: 3. Permissions & User Info (Security)
        run: |
          echo "=== 👤 User Identity ==="
          whoami || true
          id || true
          
          echo "=== 🔐 Permission Modification (chmod) ==="
          # 스크립트 생성 및 실행 권한 부여
          echo "echo 'Hello Linux'" > hello.sh
          ls -l hello.sh || true
          chmod 755 hello.sh || true
          ls -l hello.sh || true
          ./hello.sh || true
          
          echo "===  ownership (chown - simulation) ==="
          # root 권한이 필요한 명령은 sudo 사용 (비번 없이 설정된 경우)
          sudo chown root:root hello.sh || true

      # 4단계: 시스템 리소스 및 하드웨어 정보 (전문가 - 시스템 엔지니어링)
      - name: 4. System & Hardware Info
        run: |
          echo "=== 🐧 Kernel Info (uname) ==="
          uname -a || true
          
          echo "=== 💿 Disk Usage (df, du) ==="
          df -Th || true
          # 현재 디렉토리 용량 상세 확인
          du -sh * || true
          
          echo "=== 🧠 Memory & CPU (free, lscpu, top) ==="
          free -h || true
          lscpu | head -n 10 || true
          # top은 대화형이므로 배치 모드(-b)로 1회(-n 1) 실행
          top -b -n 1 | head -n 10 || true

      # 5단계: 텍스트 프로세싱 및 로그 분석 (전문가 - 데이터 가공)
      # 가장 많이 쓰이는 grep, sed, awk, find, sort, uniq 총집합
      - name: 5. Advanced Text Processing
        run: |
          echo "=== 🔍 Search (grep) ==="
          # 대소문자 무시(-i), 줄번호(-n)
          grep -i -n "critical" data/logs/app.log || true
          
          echo "=== ✂️ Stream Editor (sed) ==="
          # 파일 내 'Process'라는 단어를 'Task'로 치환하여 출력
          sed 's/Process/Task/g' data/logs/app.log | head -n 3 || true
          
          echo "=== 📊 Data Extraction (awk) ==="
          # ls -l 결과에서 파일 크기(5번째 필드)와 이름(9번째 필드)만 출력
          ls -l data/config | awk '{print $5, $9}' || true
          
          echo "=== 🕵️ File Finding (find) ==="
          # /etc 폴더에서 이름에 'release'가 들어가는 파일 찾기 (에러 무시)
          find /etc -name "*release*" 2>/dev/null || true
          
          echo "=== 🔢 Sorting & Counting (sort, uniq) ==="
          # 중복 데이터 생성 및 카운트
          echo -e "apple\nbanana\napple\norange" > fruits.txt
          sort fruits.txt | uniq -c || true

      # 6단계: 네트워크 및 프로세스 (전문가 - 트러블슈팅)
      # 에러가 발생했던 ping 등을 포함하여 안전하게 실행
      - name: 6. Network & Process Management
        run: |
          echo "=== 🌐 Network Status (ip, netstat) ==="
          ip addr show || true
          # 포트 확인 (ss 명령어가 최신 리눅스 표준)
          ss -tuln || true
          
          echo "=== 📡 Connectivity Test (ping, curl) ==="
          # ping이 막혀도 || true 덕분에 멈추지 않음
          ping -c 3 8.8.8.8 || true 
          echo "⚠️ Ping skipped or failed, but workflow continues!"
          
          # 헤더만 가져오기 (-I), 에러시 조용히 (-s)
          curl -I https://www.google.com || true
          
          echo "=== 🏭 Process Check (ps, kill) ==="
          ps -ef --sort=-%cpu | head -n 5 || true
          # 백그라운드 프로세스 실행 및 종료 테스트
          sleep 10 & 
          PID=$!
          echo "Started sleep process: $PID"
          kill -9 $PID || true
          echo "Killed process $PID"

      # 7단계: 쉘 스크립트 자동화 기능 (마스터)
      - name: 7. Automation Scripting Logic
        run: |
          echo "=== 📜 Simple Loop & Condition ==="
          # 파일 존재 여부 확인 스크립트
          if [ -f "data/config/settings.conf" ]; then
            echo "✅ Config file exists."
          else
            echo "❌ Config file missing."
          fi || true
          
          echo "=== 📅 Date & Time Variable ==="
          NOW=$(date '+%Y-%m-%d %H:%M:%S')
          echo "Current Deployment Time: $NOW" || true
          
          echo "🎉 All Comprehensive Linux Commands Executed Successfully!"
