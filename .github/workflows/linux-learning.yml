name: Linux Web Dashboard & PDF System

on:
  # ⏰ 10분마다 자동 실행 (웹사이트 갱신)
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-dashboard-system:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1. System Setup (PDF Engine & Fonts)
        run: |
          echo "=== 🛠️ SYSTEM SETUP ==="
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-latex-base texlive-fonts-recommended texlive-xetex \
            fonts-nanum fonts-noto-cjk xzdec whois
          
          if command -v xelatex >/dev/null; then
            echo "✅ XeLaTeX Ready."
          else
            echo "❌ Setup Failed."
            exit 1
          fi

      - name: 2. Initialize Directories
        run: |
          mkdir -pv output_data/manuals/pdf
          mkdir -pv output_data/manuals/markdown
          mkdir -pv output_data/logs
          mkdir -pv output_data/source

      - name: 3. Generate Manual Content (No Emojis)
        run: |
          MD_FILE="output_data/manuals/markdown/Linux_Master_Guide.md"
          cat <<'EOF' > $MD_FILE
          ---
          title: "Linux Master Manual"
          author: "Auto-Generated System"
          date: "2026-01-07"
          geometry: margin=1in
          mainfont: "NanumGothic"
          ---
          # [Linux] System Management Guide
          
          ## 1. File & Directory
          | Cmd | Desc | Usage |
          |:---|:---|:---|
          | **ls** | List files | `ls -al` |
          | **cp** | Copy | `cp -r src dst` |
          
          ## 2. User Security
          | Cmd | Desc | Usage |
          |:---|:---|:---|
          | **passwd** | Change PW | `passwd user` |
          | **useradd** | Add User | `useradd user` |
          
          ## 3. Zombie Process Code
          ```c
          #include <stdlib.h>
          #include <unistd.h>
          int main() {
            if (fork() > 0) sleep(10);
            else exit(0);
            return 0;
          }
          ```
          EOF
          echo -e "\n\n_Updated: $(date)_" >> $MD_FILE

      - name: 4. Run Simulations (User & Zombie)
        run: |
          # 유저 시뮬레이션
          sudo useradd -m test_web_user || true
          echo "test_web_user:WebPass123!" | sudo chpasswd
          sudo grep "test_web_user" /etc/shadow | head -c 20 > output_data/logs/passwd_check.log
          
          # 좀비 프로세스 시뮬레이션
          SOURCE="output_data/source/zombie.c"
          EXEC="output_data/source/zombie_exec"
          cat <<'EOF' > $SOURCE
          #include <stdlib.h>
          #include <unistd.h>
          #include <stdio.h>
          int main() {
            pid_t p = fork();
            if (p > 0) sleep(5);
            else exit(0);
            return 0;
          }
          EOF
          gcc $SOURCE -o $EXEC
          ./$EXEC &
          sleep 2
          ps aux | grep 'Z\|defunct' | grep -v grep > output_data/logs/zombie_status.log || echo "Clean" >> output_data/logs/zombie_status.log

      - name: 5. PDF Generation & External Docs
        run: |
          # PDF 변환
          pandoc "output_data/manuals/markdown/Linux_Master_Guide.md" \
            -o "output_data/manuals/pdf/Linux_Master_Guide.pdf" \
            --pdf-engine=xelatex -V mainfont="NanumGothic" || true
            
          # 외부 문서 다운로드
          wget -q -t 2 -O output_data/manuals/gnu_coreutils.pdf https://www.gnu.org/software/coreutils/manual/coreutils.pdf || true

      # 🟢 [핵심 기능] 웹 대시보드(홈페이지) 자동 생성
      - name: 6. Build Web Dashboard (index.html)
        run: |
          echo "=== 🌐 Building File Share Homepage ==="
          
          # index.html 파일 생성 (HTML5 + CSS 디자인)
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Linux Automation Dashboard</title>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #e0e0e0; margin: 0; padding: 20px; }
                  .container { max-width: 800px; margin: 0 auto; background-color: #2d2d2d; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
                  h1 { color: #4CAF50; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
                  h2 { color: #61dafb; margin-top: 30px; }
                  .card { background-color: #383838; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 5px solid #4CAF50; }
                  .card.log { border-left-color: #ff9800; }
                  .card.doc { border-left-color: #2196F3; }
                  a { color: #fff; text-decoration: none; font-weight: bold; display: block; }
                  a:hover { color: #4CAF50; }
                  .timestamp { font-size: 0.8em; color: #888; text-align: right; margin-top: -20px; margin-bottom: 20px; }
                  .refresh-note { text-align: center; color: #777; margin-top: 40px; font-size: 0.9em; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🐧 Linux System Dashboard</h1>
                  <p class="timestamp">Last Updated: $(date)</p>
                  
                  <h2>📚 PDF Manuals (Downloads)</h2>
                  <div class="card doc">
                      <a href="output_data/manuals/pdf/Linux_Master_Guide.pdf" target="_blank">📄 [Generated] Linux Master Guide.pdf</a>
                  </div>
                  <div class="card doc">
                      <a href="output_data/manuals/gnu_coreutils.pdf" target="_blank">📄 [Official] GNU Coreutils Manual.pdf</a>
                  </div>

                  <h2>🔍 System Logs & Evidence</h2>
                  <div class="card log">
                      <a href="output_data/logs/zombie_status.log" target="_blank">🧟 Zombie Process Evidence Log</a>
                  </div>
                  <div class="card log">
                      <a href="output_data/logs/passwd_check.log" target="_blank">🔑 Password Check Log</a>
                  </div>

                  <h2>💻 Source Code</h2>
                  <div class="card">
                      <a href="output_data/source/zombie.c" target="_blank">💾 C Code: zombie.c</a>
                  </div>

                  <p class="refresh-note">Updates automatically every 10 minutes via GitHub Actions.</p>
              </div>
          </body>
          </html>
          EOF
          
          echo "✅ Homepage 'index.html' generated."

      - name: 7. Deploy & Update Repository
        run: |
          echo "=== 🚀 Deploying to File Share System ==="
          git config --global user.name "Web-Dashboard-Bot"
          git config --global user.email "bot@noreply.github.com"
          
          # index.html과 데이터 폴더를 모두 추가
          git add index.html output_data/
          
          git commit -m "Auto-Deploy: Web Dashboard & Files [$(date)]" || echo "⚠️ No changes"
          
          # 안전한 Push (Rebase 사용)
          git pull --rebase origin main || echo "⚠️ Rebase conflict"
          git push || echo "⚠️ Push skipped"

      - name: 8. Upload Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Full-System-Backup
          path: |
            index.html
            output_data/
          retention-days: 5
