name: Copilot Server Ops & Upgrade

on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 실행
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (Auto/Create/Update)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - create
          - update
      count:
        description: '처리 횟수 (기본값: 10)'
        default: '10'
        required: false

jobs:
  server-ops:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. [서버 업그레이드] 시스템 및 파이썬 필수 패키지 강제 최신화
      - name: 🔥 System & Dependency Upgrade
        run: |
          echo "🔄 Updating System Packages..."
          sudo apt-get update -y && sudo apt-get upgrade -y
          
          echo "🔄 Upgrading Python Dependencies..."
          python -m pip install --upgrade pip
          # 암호화 및 데이터 처리에 필요한 cryptography 라이브러리 추가
          pip install --upgrade requests PyGithub pandas cryptography
          
          echo "✅ Server Environment Upgraded."

      # 2. [디렉토리 생성] Copilot 서버 및 보안 데이터 폴더 구조 생성
      - name: 📂 Create Workspace Directories
        run: |
          echo "🛠️ Creating Directory Structure..."
          mkdir -p copilot_server/data/encrypted
          mkdir -p copilot_server/logs
          mkdir -p copilot_server/config/permissions
          mkdir -p scripts
          
          echo "✅ Directories Created: encrypted data, logs, permissions"

      # 3. [Copilot Server 설치]
      - name: 🤖 Install Copilot Server Environment
        run: |
          echo "🚀 Setting up Copilot Server..."
          if ! command -v gh &> /dev/null; then
             echo "Installing GitHub CLI..."
             sudo apt-get install gh -y
          fi
          echo "✅ Copilot Server Environment Ready."

      # [NEW] 4. [보안/데이터 대량 생성] 암호화 파일 및 권한 파일 생성
      - name: 🔐 Generate Mass Encrypted Data & Permissions
        env:
          # inputs.count가 없거나 빈 문자열일 경우 10으로 강제 설정 (안전 장치)
          COUNT: ${{ inputs.count != '' && inputs.count || '10' }}
        run: |
          echo "⚡ Starting Mass Generation... Target Count: $COUNT"
          
          # Python 스크립트를 인라인으로 실행하여 대량 파일 생성
          python3 -c "
          import os
          import uuid
          import secrets
          import time

          try:
              count = int(os.environ.get('COUNT', 10))
          except ValueError:
              count = 10

          print(f'🔄 Generating {count} encrypted datasets and permission keys...')

          for i in range(count):
              unique_id = uuid.uuid4().hex[:8]
              timestamp = int(time.time())

              # 1. 암호화 데이터 파일 생성 (바이너리 난수)
              enc_filename = f'copilot_server/data/encrypted/data_{timestamp}_{i}_{unique_id}.enc'
              with open(enc_filename, 'wb') as f:
                  # 1MB ~ 5MB 크기의 랜덤 더미 데이터 생성 시뮬레이션 (여기서는 가볍게 1KB)
                  f.write(secrets.token_bytes(1024))
              
              # 2. 권한(Permission) 키 파일 생성
              perm_filename = f'copilot_server/config/permissions/auth_{timestamp}_{i}_{unique_id}.key'
              with open(perm_filename, 'w') as f:
                  f.write(f'-----BEGIN COPILOT ACCESS KEY-----\n{secrets.token_hex(64)}\n-----END COPILOT ACCESS KEY-----')
              
              # 3. 파일 권한 설정 (chmod 600 - 소유자만 읽기/쓰기)
              os.chmod(perm_filename, 0o600)

          print(f'✅ Successfully generated {count} sets of secured files.')
          "

      # 5. [스크립트 실행] 기존 로직 유지 (issue_manager.py)
      - name: 🏃 Run Ops Script (Robust)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          MODE: ${{ inputs.mode || 'auto' }}
          COUNT: ${{ inputs.count != '' && inputs.count || '10' }}
        run: |
          echo "⚙️ Execution Parameters -> Mode: $MODE, Count: $COUNT"
          
          if [ -f "scripts/issue_manager.py" ]; then
            python scripts/issue_manager.py
          else
            echo "⚠️ Script 'scripts/issue_manager.py' not found. Creating dummy for test."
            echo "import os; print(f'Running in {os.getenv(\"MODE\")} mode with count {os.getenv(\"COUNT\")}')" > scripts/issue_manager.py
            python scripts/issue_manager.py
          fi

      # 6. [변경사항 반영] 서버 동기화 및 푸시
      - name: 🔄 Sync & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🚀 Copilot Security Data & Permissions Update [skip ci]"
            
            # 충돌 방지 재시도 루프
            n=0
            until [ "$n" -ge 5 ]
            do
               echo "🔄 Syncing with remote server (Attempt $((n+1)))..."
               git pull --rebase origin ${GITHUB_REF_NAME} && break
               n=$((n+1))
               sleep 5
            done
            
            git push origin HEAD:${GITHUB_REF}
            echo "✅ Server Sync Completed."
          else
            echo "ℹ️ No changes needed."
          fi
