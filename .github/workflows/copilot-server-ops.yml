name: Copilot Server Ops & Upgrade

on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 실행
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (Auto/Create/Update)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - create
          - update
      count:
        description: '처리 횟수 (기본값: 10)'
        default: '10'
        required: false

jobs:
  server-ops:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. [서버 업그레이드] 시스템 및 파이썬 필수 패키지 강제 최신화
      - name: 🔥 System & Dependency Upgrade
        run: |
          echo "🔄 Updating System Packages..."
          sudo apt-get update -y && sudo apt-get upgrade -y
          
          echo "🔄 Upgrading Python Dependencies..."
          python -m pip install --upgrade pip
          # 필요한 라이브러리 추가 (requests, PyGithub 등)
          pip install --upgrade requests PyGithub pandas 
          
          echo "✅ Server Environment Upgraded."

      # 2. [디렉토리 생성] Copilot 서버 구동에 필요한 폴더 구조 생성
      - name: 📂 Create Workspace Directories
        run: |
          echo "🛠️ Creating Directory Structure..."
          # -p 옵션은 디렉토리가 이미 존재하면 에러 없이 넘어감
          mkdir -p copilot_server/data
          mkdir -p copilot_server/logs
          mkdir -p copilot_server/config
          mkdir -p scripts
          
          echo "✅ Directories Created: data, logs, config"

      # 3. [Copilot Server 설치] (예시: GitHub Copilot CLI 또는 서버 스크립트 설정)
      - name: 🤖 Install Copilot Server Environment
        run: |
          echo "🚀 Setting up Copilot Server..."
          
          # [선택] GitHub Copilot CLI 설치가 필요한 경우
          if ! command -v gh &> /dev/null; then
             echo "Installing GitHub CLI..."
             sudo apt-get install gh -y
          fi
          
          # GitHub Copilot 확장 프로그램 설치 (필요시)
          # gh extension install github/gh-copilot --force
          
          echo "✅ Copilot Server Environment Ready."

      # 4. [스크립트 실행] 에러 수정 포함 (Count 값 강제 주입)
      - name: 🏃 Run Ops Script (Robust)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          # 입력값이 없거나 스케줄 실행일 경우 기본값 로직 적용
          MODE: ${{ inputs.mode || 'auto' }}
          # ⚠️ 핵심 수정: inputs.count가 빈 문자열('')일 경우 '10'을 강제로 할당
          COUNT: ${{ inputs.count != '' && inputs.count || '10' }}
        run: |
          echo "⚙️ Execution Parameters -> Mode: $MODE, Count: $COUNT"
          
          if [ -f "scripts/issue_manager.py" ]; then
            python scripts/issue_manager.py
          else
            echo "⚠️ Script 'scripts/issue_manager.py' not found. Creating dummy for test."
            # 테스트를 위한 더미 스크립트 생성 (실제 사용 시 제거 가능)
            echo "import os; print(f'Running in {os.getenv(\"MODE\")} mode with count {os.getenv(\"COUNT\")}')" > scripts/issue_manager.py
            python scripts/issue_manager.py
          fi

      # 5. [변경사항 반영] 서버 동기화 및 푸시
      - name: 🔄 Sync & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🚀 Copilot Server Upgrade & Ops [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF}
            echo "✅ Changes pushed successfully."
          else
            echo "ℹ️ No changes to push."
          fi
