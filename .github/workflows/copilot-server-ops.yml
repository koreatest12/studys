name: Copilot AI Server Ops & Massive Training Pipeline

on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 실행
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (All/Auto/Create/Update/Train)' # 'All' 모드 명시
        required: true
        default: 'all' # 기본값을 'all'로 설정하여 모든 기능 수행 유도
        type: choice
        options:
          - all    # [NEW] 모든 기능 일괄 실행
          - auto
          - create
          - update
          - train
      count:
        description: '데이터 생성 및 학습 배치 크기 (기본값: 50)'
        default: '50'
        required: false
      epochs:
        description: 'AI 학습 반복 횟수 (Epochs)'
        default: '5'
        required: false

jobs:
  ai-server-ops:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. [환경 구축]
      - name: 🔥 Setup AI Server Environment
        run: |
          echo "🔄 Initializing AI Server Dependencies..."
          sudo apt-get update -y
          python -m pip install --upgrade pip
          pip install --upgrade requests PyGithub pandas cryptography numpy tqdm
          echo "✅ AI/ML Environment Ready."

      # 2. [인프라 구성]
      - name: 📂 Initialize Data Lake & Model Registry
        run: |
          echo "🛠️ Constructing AI Infrastructure..."
          mkdir -p copilot_server/data/raw_ingestion
          mkdir -p copilot_server/data/processed_datasets
          mkdir -p copilot_server/data/encrypted_vault
          mkdir -p copilot_server/models/checkpoints
          mkdir -p copilot_server/logs/training_metrics
          mkdir -p copilot_server/config/permissions
          mkdir -p scripts
          echo "✅ Infrastructure Created."

      # 3. [데이터 수집 & 전처리]
      - name: 🧬 Mass Data Ingestion & Preprocessing
        env:
          BATCH_SIZE: ${{ inputs.count != '' && inputs.count || '50' }}
        run: |
          echo "⚡ Starting Mass Data Ingestion..."
          python3 -c "
          import os, uuid, time, json, random
          try: count = int(os.environ.get('BATCH_SIZE', 50))
          except: count = 50
          raw_dir, proc_dir = 'copilot_server/data/raw_ingestion', 'copilot_server/data/processed_datasets'
          keywords = ['def', 'class', 'import', 'return', 'async', 'await', 'try', 'except', 'pandas', 'numpy']
          print(f'🔄 Ingesting {count} raw code snippets...')
          for i in range(count):
              tx_id = uuid.uuid4().hex[:8]
              timestamp = int(time.time())
              code_lines = [' '.join(random.choices(keywords, k=5)) for _ in range(10)]
              raw_content = '\n'.join(code_lines)
              with open(f'{raw_dir}/snippet_{timestamp}_{i}_{tx_id}.py', 'w') as f: f.write(raw_content)
              dataset_entry = {'instruction': f'Explain snippet {tx_id}', 'input': raw_content, 'output': 'Simulated output.'}
              with open(f'{proc_dir}/train_set_{timestamp}.jsonl', 'a') as f: f.write(json.dumps(dataset_entry) + '\n')
          print(f'✅ Data Pipeline Complete.')
          "

      # 4. [보안] 암호화 및 키 발급
      - name: 🔐 Encrypt Datasets & Generate Access Keys
        run: |
          echo "🔒 Encrypting Sensitive Training Data..."
          python3 -c "
          import os, secrets, glob
          proc_dir, vault_dir, perm_dir = 'copilot_server/data/processed_datasets', 'copilot_server/data/encrypted_vault', 'copilot_server/config/permissions'
          files = glob.glob(f'{proc_dir}/*.jsonl')
          for file_path in files:
              filename = os.path.basename(file_path)
              with open(file_path, 'rb') as f: data = f.read()
              with open(f'{vault_dir}/{filename}.enc', 'wb') as f: f.write(secrets.token_bytes(16) + data[::-1])
              key_path = f'{perm_dir}/key_{filename.split('.')[0]}.pem'
              with open(key_path, 'w') as f: f.write(f'-----BEGIN KEY-----\n{secrets.token_urlsafe(32)}\n-----END KEY-----')
              os.chmod(key_path, 0o600)
          print(f'✅ Security Applied: {len(files)} datasets encrypted.')
          "

      # 5. [AI 학습]
      - name: 🧠 Run AI Model Training (Fine-tuning Simulation)
        env:
          EPOCHS: ${{ inputs.epochs != '' && inputs.epochs || '5' }}
        run: |
          echo "🚀 Starting Distributed Training Simulation..."
          python3 -c "
          import os, time, random, json, uuid
          epochs = int(os.environ.get('EPOCHS', 5))
          model_dir, log_dir = 'copilot_server/models/checkpoints', 'copilot_server/logs/training_metrics'
          run_id, loss = uuid.uuid4().hex[:6], 2.5
          metrics_log = []
          for epoch in range(1, epochs + 1):
              loss = max(0.1, loss * random.uniform(0.8, 0.95))
              accuracy = 1.0 - (loss / 3.0)
              metrics_log.append({'epoch': epoch, 'loss': round(loss, 4), 'accuracy': round(accuracy, 4), 'timestamp': time.time()})
              print(f'   [Epoch {epoch}/{epochs}] Loss: {loss:.4f} | Acc: {accuracy:.2%}')
              if epoch % 2 == 0 or epoch == epochs:
                  with open(f'{model_dir}/copilot_v2_epoch{epoch}_{run_id}.pt', 'wb') as f: f.write(os.urandom(1024))
          with open(f'{log_dir}/train_metrics_{run_id}.json', 'w') as f: json.dump(metrics_log, f, indent=2)
          print('✅ Model Training Completed.')
          "

      # 6. [운영 스크립트 실행] - 'All' 모드 처리 로직 추가
      - name: 🏃 Run Ops Management Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          # 입력된 모드가 'all'이면 스크립트 내부에서 모든 로직을 처리하도록 'all' 전달
          MODE: ${{ inputs.mode || 'all' }}
        run: |
          echo "⚙️ Executing in MODE: $MODE"
          if [ -f "scripts/issue_manager.py" ]; then
            python scripts/issue_manager.py
          else
            echo "⚠️ issue_manager.py not found. Creating placeholder."
            # 'All' 모드일 때의 안내 메시지 추가
            echo "import os; mode = os.getenv('MODE'); print(f'Ops Script Running in {mode} mode... Executing FULL diagnostics.');" > scripts/issue_manager.py
            python scripts/issue_manager.py
          fi

      # 7. [동기화]
      - name: 🔄 Sync Data & Models to Repo
        run: |
          git config --global user.name "ai-ops-bot"
          git config --global user.email "ai-ops-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🧠 AI Ops: Mass Data Ingestion & Model Training Update (Mode: ${{ inputs.mode }}) [skip ci]"
            n=0
            until [ "$n" -ge 5 ]; do
               git pull --rebase origin ${GITHUB_REF_NAME} && break
               n=$((n+1)); sleep 5
            done
            git push origin HEAD:${GITHUB_REF}
            echo "✅ All AI Artifacts Synced."
          else
            echo "ℹ️ No changes to sync."
          fi
