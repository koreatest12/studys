name: Ultimate Issue Manager

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (create/update/close/report/all)'
        required: true
        default: 'all'
        type: choice
        options:
          - create   # 대량 생성
          - update   # 대량 수정 (라벨링)
          - close    # 대량 닫기
          - report   # CSV 추출
          - all      # 생성 -> 수정 -> 리포트 추출 (전체)
      count:
        description: '실행 횟수 제한 (Loop Limit)'
        required: false
        default: '10'

jobs:
  manage-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 레포지토리에 파일 업로드(Push) 권한
      issues: write    # 이슈 수정 권한
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install PyGithub

      - name: Run Issue Manager Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          COUNT: ${{ inputs.count }}
        # [중요] 사용자가 제공한 경로(scripts/)에 파일이 있다고 가정하고 실행
        run: |
          if [ -f "scripts/issue_manager.py" ]; then
            python scripts/issue_manager.py
          else
            echo "❌ Error: scripts/issue_manager.py 파일을 찾을 수 없습니다."
            echo "레포지토리의 scripts 폴더에 파일이 있는지 확인해주세요."
            exit 1
          fi

      # [서버 업데이트/디렉토리 업로드] 
      # 스크립트가 생성한 파일(예: issue_report.csv)이 있다면 레포지토리에 반영
      - name: Commit and Push Changes (Server Update)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # CSV 파일이 생성되었는지 확인
          if [ -f "issue_report.csv" ]; then
            git add issue_report.csv
            git commit -m "Update issue report [skip ci]" || echo "No changes to commit"
            git push
            echo "✅ Server updated with new report."
          else
            echo "ℹ️ No report file generated to upload."
          fi

      # [아티팩트 업로드] 파일 다운로드 기능 제공
      - name: Upload Report Artifact
        if: inputs.mode == 'report' || inputs.mode == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: issue-report-csv
          path: issue_report.csv
