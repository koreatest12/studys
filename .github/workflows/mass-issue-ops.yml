name: Ultimate Issue Manager (Fixed)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (create/update/close/report/all)'
        required: true
        default: 'all'
        type: choice
        options:
          - create   # 대량 생성
          - update   # 대량 수정 (라벨링)
          - close    # 대량 닫기
          - report   # CSV 추출
          - all      # 전체 순차 실행
      count:
        description: '실행 횟수 제한'
        required: false
        default: '10'

jobs:
  manage-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Git Push 권한 필수
      issues: write    # 이슈 수정 권한 필수
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리를 가져와야 병합 시 오류가 적음

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install PyGithub

      - name: Run Issue Manager Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          COUNT: ${{ inputs.count }}
        run: |
          # 스크립트 파일 존재 여부 확인 후 실행
          if [ -f "scripts/issue_manager.py" ]; then
            python scripts/issue_manager.py
          else
            echo "❌ scripts/issue_manager.py 파일을 찾을 수 없습니다."
            exit 1
          fi

      # ✅ [FIXED] Git Push 충돌 해결 로직 추가
      - name: Commit and Push Changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 변경 사항이 있는지 확인
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Preparing to commit..."
            
            git add .
            git commit -m "Auto-update: Issue Report & Bulk Changes [skip ci]"
            
            # --- 핵심 수정: 원격 변경 사항을 먼저 당겨옴 (Rebase) ---
            echo "🔄 Pulling latest changes..."
            git pull --rebase origin ${GITHUB_REF_NAME}
            
            # --- Push 실행 ---
            echo "🚀 Pushing to remote..."
            git push origin HEAD:${GITHUB_REF}
            
            echo "✅ Successfully updated repository."
          else
            echo "ℹ️ No changes to commit."
          fi

      - name: Upload Report Artifact
        if: inputs.mode == 'report' || inputs.mode == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: issue-report-result
          path: issue_report.csv
