name: AI Ops Master (Auto 10min & Bulk)

on:
  # 1. 스케줄러: 10분마다 자동 실행
  schedule:
    - cron: '*/10 * * * *'
  
  # 2. 수동 실행: 원할 때 즉시 실행 가능
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (auto/create/update/close/report)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto     # 10분마다 도는 자동 모드 (파일 스캔 + 리포트 갱신)
          - create   # 이슈 대량 생성
          - update   # 이슈 대량 수정 (라벨링)
          - close    # 이슈 대량 닫기
          - report   # 리포트 추출
      count:
        description: '처리할 개수'
        required: false
        default: '10'

jobs:
  ai-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 파일 수정 및 업로드 권한
      issues: write    # 이슈 관리 권한
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 가져오기 (충돌 방지용)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install PyGithub pandas

      - name: Run Ultimate Issue Manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          # 스케줄 실행(cron)일 경우 자동으로 'auto' 모드로 동작
          MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          COUNT: ${{ inputs.count }}
        run: |
          if [ -f "scripts/issue_manager.py" ]; then
            python scripts/issue_manager.py
          else
            echo "❌ Error: scripts/issue_manager.py 파일을 찾을 수 없습니다."
            exit 1
          fi

      - name: Commit and Push Changes (Robust Sync)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 변경 사항이 있는지 확인
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 AI Ops: Auto-update report & status [skip ci]"
            
            # --- [강력한 충돌 해결 로직] 5번까지 재시도 ---
            n=0
            until [ "$n" -ge 5 ]
            do
               echo "🔄 Pulling latest changes (Attempt $((n+1)))..."
               git pull --rebase origin ${GITHUB_REF_NAME} && break
               n=$((n+1))
               sleep 5
            done
            
            echo "🚀 Pushing to remote..."
            git push origin HEAD:${GITHUB_REF}
            echo "✅ Successfully updated repository."
          else
            echo "ℹ️ No changes to commit."
          fi
